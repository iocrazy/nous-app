# Locally-managed tunnel ingress —— 唯一真相在此文件（非 dashboard）
# 凭证住服务器 /media/heygo/program/nous/secrets/cloudflared/（2T 数据盘），compose 挂到容器 /etc/cloudflared/creds/
tunnel: 95222cdd-1ea0-40aa-8329-f0f6a35282bd
credentials-file: /etc/cloudflared/creds/95222cdd-1ea0-40aa-8329-f0f6a35282bd.json

ingress:
  # P1：真服务 ingress —— api → backend(8890)、sb → Kong(8000)
  - hostname: api.nous.ink
    service: http://nous-backend:8080
  - hostname: sb.nous.ink
    service: http://nous-kong:8000
  # 兜底：未匹配 hostname 返回 404
  - service: http_status:404
