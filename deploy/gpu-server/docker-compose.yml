# GPU 服务器栈：cloudflared tunnel + nous backend 三件
# Supabase 全家桶在 /media/heygo/program/datahub/nous/supabase/ 单独 compose，经共享网络 nous-net 互通
# 启动统一走 ./up.sh（含数据盘 .mounted marker 防护）
services:
  health:
    image: nginx:alpine
    container_name: nous-health
    volumes:
      - ./health/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nous-cloudflared
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      # 配置来自仓库（IaC），凭证来自 2T 数据盘（仓库树外、非系统盘，重装系统无损）
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - /media/heygo/program/datahub/nous/secrets/cloudflared:/etc/cloudflared/creds:ro
    restart: unless-stopped
    depends_on:
      - health

  redis:
    image: redis:8-alpine
    container_name: nous-redis
    command: redis-server --appendonly yes
    volumes:
      - /media/heygo/program/datahub/nous/data/redis:/data
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: nous-backend:local
    container_name: nous-backend
    ports:
      # 2026-07-28 起 10.0.0.10:8080 归 gateway(nginx 分流 /f/ 直出),
      # backend 退到 8890 作内网排障口(沿 NAS 时代 APP_PORT=8890 惯例)。
      # nas-A 反代目标不变(仍 10.0.0.10:8080),公网 api.nous.ink 经
      # cloudflared 走 docker 网络直连 nous-backend:8080,均不受影响。
      # 注意: ZeroTier 未起时 docker 会绑定失败,restart 策略会重试。
      - "10.0.0.10:8890:8080"
    env_file: /media/heygo/program/datahub/nous/secrets/backend.env
    environment:
      - MEDIAHUB_ROLE=gateway
      # materialize S3 读通缓存(spec 2026-08-02-s3-materialize-disk-cache):
      # 必须指向本地 NVMe——放 CIFS 比直接拉 S3 还慢(145 vs 266 MB/s)。
      - MEDIA_S3_CACHE_DIR=/app/s3cache
      # 会话通道的浏览器执行器(见下方 browser service)。地址不是密钥,放这里;
      # 配套的 BROWSER_INTERNAL_TOKEN 是共享密钥,放 secrets/backend.env。
      # ⚠️ browser 侧**不共用**这个 env_file(理由见 browser service 的注释),
      # 所以同一个 token 值要在 backend.env 与 browser.env 里各写一份。写歪了
      # 表现为 browser 返回 401 —— 可见的类型化失败,不是静默 no-op。
      - BROWSER_SERVICE_URL=http://nous-browser:8090
      # CodexCliProvider(gpt-image-2-skill)的登录态文件。凭证是宿主机 heygo 的
      # Codex OAuth 会话(bind mount,见下方 volumes),不是 api_key。
      - CODEX_AUTH_FILE=/app/.codex/auth.json
      - MEDIA_WORK_DIR_REQUIRE_MARKER=true
    volumes:
      # 媒体中转区(2026-09-07):yt-dlp 落盘 / ffmpeg HLS 工作目录 / 缩略图暂存,
      # 上传 S3 后即删。本机 NVMe(ext4),不再走 nas-B 的 CIFS——成品仍在 S3。
      # 目录要带 .mounted marker(up.sh 校验)且对 uid 1031 可写(ACL),
      # 容器内 work_dir_probe 会真写一次;缺 marker = 影子目录,拒绝就绪。
      - /media/heygo/cache/nous-cache:/app/downloads
      - /media/heygo/program/datahub/nous/data/s3cache:/app/s3cache
      # Codex OAuth 会话目录,必须读写:CLI 会把刷新后的 access_token 写回
      # auth.json。容器 uid=1031 vs 宿主 heygo(1000) —— 用 ACL 授权,不改属主:
      #   setfacl -R -m u:1031:rwX -m d:u:1031:rwX /home/heygo/.codex
      # 部署后必须跑写入探针(读正常≠服务正常),见 docs/runbook/codex-image.md。
      - /home/heygo/.codex:/app/.codex
      # 即梦 CLI OAuth token — 容器重建会丢（2026-08-23 实发），落在宿主
      # secrets 目录挂进来；uid 1031 用 ACL 授权（同 .codex 做法）。
      # 重新登录: docker exec nous-worker dreamina login，token 会直接写回
      # 这个挂载目录，无需再拷贝。
      - /media/heygo/program/datahub/nous/secrets/dreamina:/app/.local/share/dreamina
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    # 刻意不 depends_on browser:browser 冷启动 ~2min(Xvfb + chromium 预热),
    # 挂上去会把 API 可用时间绑死在浏览器身上。调用方本就必须容忍 browser 不
    # 可用并返回类型化失败(spec §7.8),不能靠启动顺序兜底。
    # 覆盖 Dockerfile 的 /health(硬编码 {"status":"healthy"},DBOS 挂了照样 200
    # —— 2026-07-22 起静默 3 天就是因为它)。readyz 在 DBOS_DATABASE_URL 配了
    # 却 init 失败时返回 503 degraded。
    # 只在本栈覆盖:gpupc 无 autoheal,unhealthy 仅标记状态;NAS 栈有
    # mediahub-autoheal(只重启 unhealthy),继续用 Dockerfile 的 liveness 探针,
    # 免得配置类故障引发循环重启。
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/readyz || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: unless-stopped

  # 发布模块「会话通道」的浏览器执行器(spec 2026-08-04-distribution-session-channel)。
  # 独立容器的三个理由(spec §2.1):镜像 ~1.5GB 不该拖慢每次后端部署;浏览器是内存
  # 黑洞需独立限流;浏览器 OOM 不能带死 API 进程。
  browser:
    build:
      # 自包含目录,context 就是 browser/ 本身(同 admin service 风格)。
      # 不用仓库根:根 .dockerignore 没排除 browser/,但会把整个 backend/ +
      # nous-core/ 塞进上下文,构建平白慢几十秒。
      context: ../../browser
      dockerfile: Dockerfile
    image: nous-browser:local
    container_name: nous-browser
    # ⚠️ 故意不写 ports —— 该服务持有解密后的平台会话(cookie/storage_state),
    # 绝不能对宿主机或 ZeroTier 网段可达。backend/worker 走 docker 内网
    # http://nous-browser:8090。
    # 注意 nous-net 是 external 共享网络,supabase 全家桶也挂在上面,所以"内网"
    # 并不等于"只有 backend 能访问" —— 真正的边界是 BROWSER_INTERNAL_TOKEN,
    # 服务端必须强校验(缺 token 应启动即 fail,不得 fallback 放行)。
    #
    # ⚠️ 刻意**不复用** secrets/backend.env(gateway 那种共用法在这里是危险的)。
    # backend.env 里有 SUPABASE_SERVICE_ROLE_KEY、MEDIAHUB_TOKEN_ENCRYPTION_KEY、
    # 带密码的 PG DSN —— 而本容器的全部工作就是让 Chromium 去加载抖音等外部
    # 站点的敏感页面。把"解密所有用户 session_state 的主密钥"注入这个进程,
    # 等于让一次渲染器逃逸/SSRF 直接升级成全库沦陷,§7.6 的加密存储也就白做了。
    # 因此单开一个只含 BROWSER_INTERNAL_TOKEN 的最小 env 文件。
    # 📌 首次部署前需在 gpupc 上手工创建(否则 compose 会拒绝起栈,见 README):
    #    printf 'BROWSER_INTERNAL_TOKEN=%s\n' "$(openssl rand -hex 32)" \
    #      > /media/heygo/program/datahub/nous/secrets/browser.env
    #    chmod 600 /media/heygo/program/datahub/nous/secrets/browser.env
    #    # 同一个值再追加到 secrets/backend.env(调用方 backend/worker 要用)
    # 代价是两个文件要放同一个值;漂移时 browser 返回 401,是可见的类型化失败,
    # 比"密钥过度暴露"这种静默风险好诊断得多。
    env_file: /media/heygo/program/datahub/nous/secrets/browser.env
    environment:
      # Xvfb 虚拟帧缓冲:必须有头运行,headless 的可检测特征会被抖音级风控查出来
      # (spec §2.4)。DISPLAY 与镜像内 Xvfb 启动的显示号一致。
      - DISPLAY=:99
    # Chromium 默认 /dev/shm 只有 64MB,渲染进程会随机崩("Target closed")。
    # 1g 是 Playwright 官方 docker 建议档位;tmpfs 按需分配,只是上限不预留。
    #
    # ⚠️ 与 app/browser_runtime.py 的 LAUNCH_ARGS 成对存在,改一处必须看另一处:
    # 那边**刻意不传** `--disable-dev-shm-usage`。该 flag 会让 Chromium 改用
    # /tmp 存共享内存段,而容器没挂 volume,/tmp 落在 overlay 可写层 = 真磁盘;
    # /dev/shm 则始终是 tmpfs = 内存。对一个专门加载已登录页面的浏览器,把渲染
    # 缓冲写上磁盘与 spec §7.6「凭证不落盘」方向相反。所以这里给足 shm、那边
    # 不传 flag。把 shm_size 缩掉而不同时恢复 flag,会把随机崩溃带回来。
    shm_size: 1gb
    # chromium 会留一串子进程,没有 PID 1 收割就攒僵尸,最终耗尽 pid。
    init: true
    # 内存上限的目的不是省内存(gpupc 有 123G),而是兑现 spec §2.1 的崩溃隔离:
    # 浏览器泄漏时必须自己被 OOM-kill + restart,不能把 nous-backend / nous-db
    # 拖下水。取值依据:playwright+chromium 常驻约 0.5G,每个 account context
    # 0.2–0.4G,发布页缓冲几百 MB 视频;S1–S5 是单账号串行(1–2 context),6g 有
    # 约 10x 头寸;同时只占宿主 5%,失控也伤不到别人。S6 起并发上调时同步调大。
    mem_limit: 6g
    # 与 mem_limit 相等 == 禁用 swap:宁可快速 OOM 重启,也不要浏览器把 8G swap
    # 打满拖慢整机(内存黑洞类服务 swap thrash 比崩溃更难诊断)。
    memswap_limit: 6g
    # ⚠️ 不挂任何 volume(spec §7.6 凭证不落盘):session_state 明文只允许存在于
    # 本进程内存。附带好处是彻底绕开"容器 uid ≠ 宿主目录属主"这个历史上炸过
    # 四次的故障模式 —— 没有 bind mount 就没有 chmod 755 待办。
    # ⚠️ 刻意**不覆盖** healthcheck —— 与 backend/gateway 的处理相反,原因要说清:
    # backend 那两处覆盖是因为 Dockerfile 探针是假的(硬编码 {"status":"healthy"},
    # DBOS 挂了照样 200)。而 browser/Dockerfile 的 HEALTHCHECK 是真探针:它会
    # 实打实拉起一次 Chromium,Xvfb/浏览器不可用时返回 503,并按此调好了超时
    # (timeout 20s / urlopen 15s —— 起浏览器远慢于一次 HTTP)。在 compose 里再抄
    # 一份只会两处漂移,而且外部抄的版本必然比作者那版更容易把超时写窄。
    # 判据仍是「探针探真信号」,不是「谁定义的」。
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    container_name: nous-gateway
    ports:
      # nas-A(cn.nous.ink:88)的反代目标。全部转 nous-backend;/f/ 签名直出
      # 已于 2026-09-07 退役(库里没有本地路径了),gateway 不再挂任何媒体目录、
      # 也不再需要 secrets env。
      - "10.0.0.10:8080:80"
    volumes:
      - ./nginx-gateway:/etc/nginx/templates:ro
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1, NOT localhost: inside the alpine container `localhost`
      # resolves to ::1 first, and nginx here only binds IPv4 — the probe
      # got "connection refused" forever and the container sat permanently
      # unhealthy, which desensitizes `docker ps` as an incident signal
      # (2026-08-01: masked nothing this time, but the badge was noise
      # while diagnosing the nous-rest outage).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    image: nous-backend:local
    container_name: nous-worker
    env_file: /media/heygo/program/datahub/nous/secrets/backend.env
    environment:
      - MEDIAHUB_ROLE=worker
      # 同 backend:materialize S3 读通缓存,共享同一宿主机 NVMe 目录。
      - MEDIA_S3_CACHE_DIR=/app/s3cache
      # 同 backend:session 通道的发布/校验 workflow 实际跑在 worker 上,
      # 所以这条对 worker 才是必需的。token 同样来自共享的 secrets/backend.env。
      - BROWSER_SERVICE_URL=http://nous-browser:8090
      # 同 backend:shot/canvas 生成 workflow 实际跑在 worker 上,codex 生图
      # 的 subprocess 也在这里执行。
      - CODEX_AUTH_FILE=/app/.codex/auth.json
      - MEDIA_WORK_DIR_REQUIRE_MARKER=true
    volumes:
      # 媒体中转区(2026-09-07):yt-dlp 落盘 / ffmpeg HLS 工作目录 / 缩略图暂存,
      # 上传 S3 后即删。本机 NVMe(ext4),不再走 nas-B 的 CIFS——成品仍在 S3。
      # 目录要带 .mounted marker(up.sh 校验)且对 uid 1031 可写(ACL),
      # 容器内 work_dir_probe 会真写一次;缺 marker = 影子目录,拒绝就绪。
      - /media/heygo/cache/nous-cache:/app/downloads
      - /media/heygo/program/datahub/nous/data/s3cache:/app/s3cache
      # 同 backend:Codex OAuth 会话目录(读写,ACL 授权 uid 1031)。
      - /home/heygo/.codex:/app/.codex
      # 即梦 CLI OAuth token — 容器重建会丢（2026-08-23 实发），落在宿主
      # secrets 目录挂进来；uid 1031 用 ACL 授权（同 .codex 做法）。
      # 重新登录: docker exec nous-worker dreamina login，token 会直接写回
      # 这个挂载目录，无需再拷贝。
      - /media/heygo/program/datahub/nous/secrets/dreamina:/app/.local/share/dreamina
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - backend
    # worker 的唯一职责就是消费 DBOS 队列,而它原先的 healthcheck 探的是
    # /health —— 连 API router 都没挂载(实测 /api/v1/resources → 404),那个 200
    # 完全不代表队列在跑。readyz 由 lifespan_router 无条件挂载,worker 上可用。
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/readyz || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: unless-stopped

  falkordb:
    image: falkordb/falkordb:latest
    container_name: nous-falkordb
    volumes:
      - /media/heygo/program/datahub/nous/data/falkordb:/var/lib/falkordb/data
    restart: unless-stopped

  newsnow:
    image: ghcr.io/ourongxing/newsnow:latest
    container_name: nous-newsnow
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - NODE_ENV=production
    restart: unless-stopped

  admin:
    build:
      context: ../../admin
      dockerfile: Dockerfile
      args:
        # 本机专用(2026-08-27 起不再走 admin.nous.ink):API 留空 → 同源 /api,
        # 由镜像内 nginx 代理到 nous-backend;Supabase 走 kong 的回环口。
        # anon key 是公开的。
        VITE_API_URL: ""
        VITE_SUPABASE_URL: http://127.0.0.1:9082
        VITE_SUPABASE_ANON_KEY: ${NOUS_ANON_KEY}
    image: nous-admin:local
    container_name: nous-admin
    restart: unless-stopped
    # 只绑回环:admin 不对外,浏览器开 http://127.0.0.1:8090
    ports:
      - "127.0.0.1:8090:8080"

networks:
  default:
    name: nous-net
    external: true
