version: '3.8'

services:
  douyin-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: douyin-analysis
    ports:
      - "8080:8080"  # 宿主机端口:容器端口（容器内部固定8080）
    environment:

      # 在生产环境中，建议通过环境变量或secrets传递敏感信息

    volumes:
      # 🔗 数据挂载配置 - 使用Docker volumes（开发环境）
      # 数据库文件持久化
      - D:/Docker/douyin_analysis/data:/app/data
      # 下载视频文件持久化
      - D:/Docker/douyin_analysis/download:/app/videos
      # 应用日志持久化
      - douyin_logs:/app/logs
      # 配置文件挂载（开发环境可选）
      - ./config.yml:/app/config.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'


volumes:
  douyin_data:
    driver: local
  douyin_videos:
    driver: local
  douyin_logs:
    driver: local

networks:
  default:
    name: douyin-network
