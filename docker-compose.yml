version: '3.8'

services:
  mediahub:
    build: .
    image: mediahub:latest
    container_name: mediahub
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./downloads:/app/downloads
      - ./backend/.env:/app/.env
      - ./backend/frontend_config.yml:/app/frontend_config.yml
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
