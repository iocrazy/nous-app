# MediaHub Docker Compose
# 群晖 NAS / Docker 部署

version: '3.8'

services:
  mediahub-backend:
    build: .
    image: mediahub:latest
    container_name: mediahub-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 下载目录 - 映射到 NAS 共享文件夹
      # 群晖示例: /volume1/docker/mediahub/downloads
      - ./downloads:/app/downloads
      # 环境变量文件
      - ./backend/.env:/app/.env
      # 前端配置文件
      - ./backend/frontend_config.yml:/app/frontend_config.yml
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 前端 (可选 - 也可以单独部署到 Web Station)
  mediahub-frontend:
    image: nginx:alpine
    container_name: mediahub-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mediahub-backend
