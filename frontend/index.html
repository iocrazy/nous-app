<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- First-paint theme (island redesign D11): resolve the saved preference
         before any CSS applies so light-OS / light-preference users never see
         a dark flash. Mirrors contexts/ThemeContext.tsx exactly (storage key,
         'system' default, prefers-color-scheme resolution). -->
    <script>
      (function () {
        var pref = 'system';
        try {
          var saved = localStorage.getItem('mediahub.theme');
          if (saved === 'light' || saved === 'dark' || saved === 'system') pref = saved;
        } catch (e) { /* Safari private mode — fall back to system */ }
        var resolved = pref;
        if (pref === 'system') {
          try {
            resolved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          } catch (e) { resolved = 'dark'; }
        }
        document.documentElement.setAttribute('data-theme', resolved);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MediaHub</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Media library and content management" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MediaHub" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preconnect" href="https://sb-mediahub.heygo.cn:88" crossorigin />
    <link rel="dns-prefetch" href="https://sb-mediahub.heygo.cn:88" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
