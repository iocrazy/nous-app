<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline | MediaHub</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0c0c1a 0%, #0c1525 40%, #0f172a 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      overflow: hidden;
      position: relative;
    }
    .particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .particle {
      position: absolute; border-radius: 50%;
      animation: drift linear infinite;
    }
    @keyframes drift {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; } 90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
    .subtitle {
      font-size: 0.85rem; font-weight: 600; letter-spacing: 0.3em;
      text-transform: uppercase; color: #60a5fa; margin-bottom: 2rem;
    }
    .hero { position: relative; margin-bottom: 2.5rem; user-select: none; }
    .big-text {
      font-size: clamp(5rem, 14vw, 9rem);
      font-weight: 900; line-height: 0.9; letter-spacing: -0.02em;
      background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.03) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .plug-wrapper {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .cable-left { animation: swingL 3s ease-in-out infinite; transform-origin: 95px 60px; }
    .cable-right { animation: swingR 3s ease-in-out infinite; transform-origin: 125px 60px; }
    @keyframes swingL { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-8deg); } }
    @keyframes swingR { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(8deg); } }
    .title { font-size: 1.6rem; font-weight: 700; color: #e4e4e7; margin-bottom: 0.75rem; }
    .message { font-size: 1rem; color: #71717a; line-height: 1.7; margin-bottom: 2.5rem; max-width: 440px; text-align: center; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.6rem;
      padding: 0.9rem 2rem;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff; border: none; border-radius: 14px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      text-decoration: none; transition: all 0.3s;
      box-shadow: 0 8px 30px rgba(59, 130, 246, 0.35);
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(59, 130, 246, 0.5); }
    .footer { position: fixed; bottom: 2rem; font-size: 0.8rem; color: #3f3f46; }
    .glow { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; }
    .glow-1 { width: 500px; height: 500px; background: #3b82f6; top: -200px; left: -150px; opacity: 0.07; }
    .glow-2 { width: 400px; height: 400px; background: #6366f1; bottom: -150px; right: -100px; opacity: 0.09; }
    .net-obj { position: fixed; pointer-events: none; z-index: 0; }
    .bob-1 { animation: bob1 12s ease-in-out infinite; }
    .bob-2 { animation: bob2 16s ease-in-out infinite; }
    .bob-3 { animation: bob3 10s ease-in-out infinite; }
    @keyframes bob1 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
    @keyframes bob2 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(12px)} }
    @keyframes bob3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(10px,-10px)} }
    .wave-ring { animation: waveOut 3s ease-out infinite; }
    @keyframes waveOut { 0%{r:5;opacity:0.4} 100%{r:20;opacity:0} }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="particles">
    <div class="particle" style="width:3px;height:3px;background:#3b82f6;left:15%;animation-duration:9s;animation-delay:0s"></div>
    <div class="particle" style="width:2px;height:2px;background:#6366f1;left:35%;animation-duration:11s;animation-delay:1.5s"></div>
    <div class="particle" style="width:4px;height:4px;background:#60a5fa;left:55%;animation-duration:8s;animation-delay:0.5s"></div>
    <div class="particle" style="width:2px;height:2px;background:#818cf8;left:75%;animation-duration:10s;animation-delay:3s"></div>
    <div class="particle" style="width:3px;height:3px;background:#3b82f6;left:90%;animation-duration:12s;animation-delay:2s"></div>
  </div>

  <!-- Floating network elements - randomly scattered -->
  <!-- Signal tower - top right area -->
  <div class="net-obj bob-1" style="top:7%;right:14%">
    <svg width="40" height="50" viewBox="0 0 40 50" opacity="0.15"><rect x="18" y="15" width="4" height="35" rx="2" fill="#3b82f6"/><circle cx="20" cy="12" r="4" fill="#3b82f6"/><path d="M8 20 Q20 5 32 20" stroke="#60a5fa" stroke-width="1.5" fill="none" opacity="0.5"/><path d="M12 24 Q20 14 28 24" stroke="#60a5fa" stroke-width="1.5" fill="none" opacity="0.7"/></svg>
  </div>
  <!-- Cloud with X - upper left -->
  <div class="net-obj bob-2" style="top:22%;left:4%">
    <svg width="55" height="35" viewBox="0 0 55 35" opacity="0.12"><path d="M15 28a10 10 0 01-2-19.8A12 12 0 0136 8a8 8 0 013 15.4H15z" fill="none" stroke="#6366f1" stroke-width="2"/><line x1="20" y1="14" x2="28" y2="22" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/><line x1="28" y1="14" x2="20" y2="22" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/></svg>
  </div>
  <!-- Signal waves - bottom left -->
  <div class="net-obj" style="bottom:28%;left:7%">
    <svg width="50" height="50" viewBox="0 0 50 50" opacity="0.15"><circle class="wave-ring" cx="25" cy="25" r="5" stroke="#3b82f6" stroke-width="1.5" fill="none"/><circle class="wave-ring" cx="25" cy="25" r="5" stroke="#3b82f6" stroke-width="1.5" fill="none" style="animation-delay:1s"/><circle cx="25" cy="25" r="3" fill="#3b82f6" opacity="0.4"/></svg>
  </div>
  <!-- Small satellite - right mid-lower -->
  <div class="net-obj bob-3" style="top:62%;right:5%">
    <svg width="35" height="35" viewBox="0 0 35 35" opacity="0.12"><rect x="12" y="12" width="11" height="11" rx="2" fill="none" stroke="#818cf8" stroke-width="2"/><line x1="6" y1="17" x2="12" y2="17" stroke="#818cf8" stroke-width="2"/><line x1="23" y1="17" x2="29" y2="17" stroke="#818cf8" stroke-width="2"/><rect x="3" y="14" width="5" height="7" rx="1" fill="none" stroke="#818cf8" stroke-width="1.5"/><rect x="27" y="14" width="5" height="7" rx="1" fill="none" stroke="#818cf8" stroke-width="1.5"/></svg>
  </div>
  <!-- Broken chain link - upper left scattered -->
  <div class="net-obj bob-1" style="top:11%;left:22%">
    <svg width="35" height="20" viewBox="0 0 35 20" opacity="0.1"><rect x="1" y="4" width="14" height="12" rx="6" fill="none" stroke="#60a5fa" stroke-width="2"/><rect x="20" y="4" width="14" height="12" rx="6" fill="none" stroke="#60a5fa" stroke-width="2"/></svg>
  </div>
  <!-- Small cloud - bottom right -->
  <div class="net-obj bob-2" style="bottom:9%;right:19%">
    <svg width="40" height="25" viewBox="0 0 55 35" opacity="0.08"><path d="M15 28a10 10 0 01-2-19.8A12 12 0 0136 8a8 8 0 013 15.4H15z" fill="#6366f1"/></svg>
  </div>
  <!-- Ethernet plug - top center-left -->
  <div class="net-obj bob-3" style="top:5%;left:38%">
    <svg width="30" height="35" viewBox="0 0 30 35" opacity="0.1"><rect x="5" y="10" width="20" height="18" rx="3" fill="none" stroke="#60a5fa" stroke-width="1.5"/><rect x="9" y="14" width="3" height="4" rx="0.5" fill="#60a5fa" opacity="0.6"/><rect x="14" y="14" width="3" height="4" rx="0.5" fill="#60a5fa" opacity="0.6"/><rect x="19" y="14" width="3" height="4" rx="0.5" fill="#60a5fa" opacity="0.6"/><line x1="15" y1="28" x2="15" y2="35" stroke="#60a5fa" stroke-width="1.5"/></svg>
  </div>
  <!-- WiFi slash icon - right upper -->
  <div class="net-obj bob-1" style="top:35%;right:11%">
    <svg width="30" height="28" viewBox="0 0 30 28" opacity="0.1"><path d="M3 8 Q15 -2 27 8" stroke="#818cf8" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M8 13 Q15 6 22 13" stroke="#818cf8" stroke-width="1.5" fill="none" stroke-linecap="round"/><circle cx="15" cy="20" r="2.5" fill="#818cf8"/><line x1="5" y1="3" x2="25" y2="23" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.6"/></svg>
  </div>
  <!-- Signal waves - bottom center-right -->
  <div class="net-obj" style="bottom:14%;left:62%">
    <svg width="35" height="35" viewBox="0 0 35 35" opacity="0.1"><circle class="wave-ring" cx="17" cy="17" r="4" stroke="#6366f1" stroke-width="1" fill="none"/><circle class="wave-ring" cx="17" cy="17" r="4" stroke="#6366f1" stroke-width="1" fill="none" style="animation-delay:1.5s"/><circle cx="17" cy="17" r="2" fill="#6366f1" opacity="0.3"/></svg>
  </div>
  <!-- Router icon - left lower -->
  <div class="net-obj bob-2" style="bottom:35%;left:3%">
    <svg width="40" height="30" viewBox="0 0 40 30" opacity="0.08"><rect x="5" y="15" width="30" height="12" rx="3" fill="none" stroke="#3b82f6" stroke-width="1.5"/><circle cx="12" cy="21" r="2" fill="#3b82f6"/><circle cx="20" cy="21" r="2" fill="#3b82f6"/><line x1="15" y1="15" x2="15" y2="7" stroke="#3b82f6" stroke-width="1.5"/><line x1="25" y1="15" x2="28" y2="5" stroke="#3b82f6" stroke-width="1.5"/></svg>
  </div>
  <!-- Tiny cloud - top right edge -->
  <div class="net-obj bob-3" style="top:3%;right:28%">
    <svg width="30" height="20" viewBox="0 0 55 35" opacity="0.06"><path d="M15 28a10 10 0 01-2-19.8A12 12 0 0136 8a8 8 0 013 15.4H15z" fill="#3b82f6"/></svg>
  </div>

  <p class="subtitle">No Connection</p>

  <div class="hero">
    <div class="big-text">OFFLINE</div>
    <div class="plug-wrapper">
      <svg width="220" height="120" viewBox="0 0 220 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Left cable + plug -->
        <g class="cable-left">
          <path d="M0 60 Q30 50 60 58 Q80 62 90 58" stroke="#3b82f6" stroke-width="4" fill="none" stroke-linecap="round"/>
          <rect x="88" y="46" width="28" height="28" rx="5" fill="#1e293b" stroke="#334155" stroke-width="2"/>
          <rect x="92" y="52" width="18" height="16" rx="3" fill="#0f172a"/>
          <circle cx="101" cy="60" r="2.5" fill="#3b82f6">
            <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
          </circle>
          <!-- Prongs -->
          <rect x="116" y="53" width="10" height="4" rx="2" fill="#94a3b8"/>
          <rect x="116" y="63" width="10" height="4" rx="2" fill="#94a3b8"/>
        </g>
        <!-- Right cable + socket -->
        <g class="cable-right">
          <path d="M220 60 Q190 50 160 58 Q140 62 130 58" stroke="#6366f1" stroke-width="4" fill="none" stroke-linecap="round"/>
          <rect x="104" y="46" width="28" height="28" rx="5" fill="#1e293b" stroke="#334155" stroke-width="2"/>
          <rect x="110" y="52" width="18" height="16" rx="3" fill="#0f172a"/>
          <circle cx="119" cy="60" r="2.5" fill="#6366f1">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
          </circle>
          <!-- Socket holes -->
          <rect x="94" y="53" width="10" height="4" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1"/>
          <rect x="94" y="63" width="10" height="4" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        </g>
        <!-- Spark in gap -->
        <circle cx="110" cy="57" r="1.5" fill="#60a5fa">
          <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
          <animate attributeName="cx" values="108;112;108" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="110" cy="63" r="1" fill="#818cf8">
          <animate attributeName="opacity" values="0.5;0;0.5" dur="0.9s" repeatCount="indefinite"/>
        </circle>
        <!-- WiFi icon with X -->
        <g transform="translate(110, 20)" opacity="0.6">
          <path d="M-14 -2 Q0 -14 14 -2" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M-8 3 Q0 -5 8 3" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
          <circle cx="0" cy="8" r="2" fill="#475569"/>
          <line x1="-10" y1="-8" x2="10" y2="8" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
        </g>
      </svg>
    </div>
  </div>

  <h1 class="title">Connection Lost</h1>
  <p class="message">Your internet connection appears to be offline. Check your network settings and try reconnecting.</p>
  <a href="javascript:location.reload()" class="btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    Reconnect
  </a>
  <div class="footer">MediaHub</div>
</body>
</html>
