# Backend Auto Deploy via Alibaba Cloud ACR + Watchtower
# Flow: Build → Push to ACR → Watchtower auto-pulls on NAS
#
# Triggers:
#   - Push to master: builds 'latest' tag
#   - Push version tag (v*): builds versioned release

name: Deploy Backend to ACR

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'docker/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-backend.yml'
    tags:
      - 'v*'

concurrency:
  group: deploy-backend
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-push:
    name: Build and Push to ACR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/mediahub-backend:latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/mediahub-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record deployment log in Supabase
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          # Find last recorded deployment commit
          LAST_SHA=$(curl -sf \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            "$SUPABASE_URL/rest/v1/deployment_logs?service=eq.backend&status=eq.success&order=deployed_at.desc&limit=1&select=commit_sha" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['commit_sha'] if d else '')" 2>/dev/null || echo "")
          echo "Last deployed SHA: ${LAST_SHA:-<none>}"
          git fetch --unshallow 2>/dev/null || true

          if [ -n "$LAST_SHA" ] && git cat-file -e "$LAST_SHA" 2>/dev/null; then
            RANGE="${LAST_SHA}..HEAD"
          else
            RANGE="HEAD~20..HEAD"
          fi
          # Build commits JSON array: [{sha, subject, author, type}]
          COMMITS_JSON=$(git log "$RANGE" --pretty=format:'{"sha":"%h","subject":"%s","author":"%an","date":"%aI"}' | python3 -c "
          import sys, json, re
          items = []
          for line in sys.stdin:
            line = line.strip()
            if not line: continue
            try:
              o = json.loads(line)
              m = re.match(r'^(\w+)(\([^)]+\))?!?:', o['subject'])
              o['type'] = m.group(1) if m else 'other'
              items.append(o)
            except: pass
          print(json.dumps(items))
          ")
          COUNT=$(echo "$COMMITS_JSON" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          # Generate summary: group by type, list subjects
          SUMMARY=$(echo "$COMMITS_JSON" | python3 -c "
          import sys, json
          items = json.load(sys.stdin)
          if not items:
            print('No changes')
          else:
            groups = {}
            for it in items:
              groups.setdefault(it['type'], []).append(it['subject'])
            parts = []
            order = ['feat', 'fix', 'perf', 'refactor', 'docs', 'chore', 'other']
            label = {'feat': '✨ Features', 'fix': '🐛 Fixes', 'perf': '⚡ Performance',
                     'refactor': '♻️ Refactor', 'docs': '📝 Docs', 'chore': '🔧 Chore', 'other': '📦 Other'}
            for t in order:
              if t in groups:
                parts.append(f\"{label[t]} ({len(groups[t])}): \" + '; '.join(groups[t][:5]))
            print(' | '.join(parts)[:500])
          ")
          HEAD_SHA=$(git rev-parse --short HEAD)
          VERSION="${{ steps.version.outputs.version }}"

          # Build payload and POST
          python3 -c "
          import json, os
          payload = {
            'service': 'backend',
            'version': '$VERSION',
            'commit_sha': '$HEAD_SHA',
            'commit_count': $COUNT,
            'commits': json.loads('''$COMMITS_JSON''' or '[]'),
            'summary': '''$SUMMARY''',
            'deployed_by': '${{ github.actor }}',
            'status': 'success',
            'metadata': {
              'run_id': '${{ github.run_id }}',
              'image': '${{ secrets.ACR_NAMESPACE }}/mediahub-backend:latest',
            }
          }
          print(json.dumps(payload))
          " > /tmp/deploy_payload.json

          curl -sf \
            -X POST "$SUPABASE_URL/rest/v1/deployment_logs" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data @/tmp/deploy_payload.json \
            && echo "✅ Deployment logged ($COUNT commits)" \
            || echo "⚠️ Failed to log deployment (non-fatal)"

      - name: Trigger Watchtower update
        run: |
          echo "🔄 Triggering Watchtower to pull new image..."
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            "${{ secrets.WATCHTOWER_URL }}" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Watchtower triggered successfully"
          else
            echo "⚠️ Watchtower trigger returned HTTP $HTTP_CODE (will auto-poll in 5min)"
          fi

      - name: Summary
        run: |
          echo "### ✅ Image pushed to ACR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** \`${{ secrets.ACR_REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ secrets.ACR_NAMESPACE }}/mediahub-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Watchtower** triggered to pull and restart on NAS" >> $GITHUB_STEP_SUMMARY
