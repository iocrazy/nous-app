# Backend Auto Deploy to NAS via Docker Hub
# Triggers:
#   - Push to master: builds 'latest' tag
#   - Push version tag (v*): builds versioned release

name: Deploy Backend to NAS

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'docker/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-backend.yml'
    tags:
      - 'v*'

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE_NAME: imheygo/mediahub

permissions:
  contents: write

jobs:
  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to NAS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to NAS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NAS_HOST }}
          port: ${{ secrets.NAS_PORT }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"

            cd ${{ secrets.NAS_PROJECT_PATH }}

            echo "📥 Pulling latest code..."
            git fetch origin master
            git reset --hard origin/master

            echo "🐳 Pulling Docker image from Docker Hub..."
            sudo docker pull imheygo/mediahub:latest

            echo "🚀 Restarting services..."
            cd docker
            sudo docker compose up -d --force-recreate mediahub celery-worker celery-beat

            echo "🔄 Restarting admin panel (refresh nginx DNS)..."
            sudo docker compose restart mediahub-admin 2>/dev/null || true

            echo "🧹 Cleaning up old images..."
            sudo docker image prune -f

            echo "✅ Backend deployment complete!"
