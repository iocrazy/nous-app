# Backend Auto Deploy to NAS via Docker Hub
# Triggers on push to master branch, only when backend files change

name: Deploy Backend to NAS

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'docker/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-backend.yml'

env:
  IMAGE_NAME: imheygo/mediahub

jobs:
  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to NAS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to NAS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NAS_HOST }}
          port: ${{ secrets.NAS_PORT }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          script: |
            cd ${{ secrets.NAS_PROJECT_PATH }}

            echo "📥 Pulling latest code..."
            git pull origin master

            echo "🐳 Pulling Docker image from Docker Hub..."
            docker pull imheygo/mediahub:latest

            echo "🚀 Restarting services..."
            cd docker
            docker-compose up -d --force-recreate mediahub celery-worker celery-beat

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Backend deployment complete!"
