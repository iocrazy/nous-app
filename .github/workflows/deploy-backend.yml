# Backend Auto Deploy via Alibaba Cloud ACR + Watchtower
# Flow: Build → Push to ACR → Watchtower auto-pulls on NAS
#
# Triggers:
#   - Push to master: builds 'latest' tag
#   - Push version tag (v*): builds versioned release

name: Deploy Backend to ACR

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'docker/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-backend.yml'
    tags:
      - 'v*'

concurrency:
  group: deploy-backend
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-push:
    name: Build and Push to ACR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/mediahub-backend:latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/mediahub-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Watchtower update
        run: |
          echo "🔄 Triggering Watchtower to pull new image..."
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            "${{ secrets.WATCHTOWER_URL }}" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Watchtower triggered successfully"
          else
            echo "⚠️ Watchtower trigger returned HTTP $HTTP_CODE (will auto-poll in 5min)"
          fi

      - name: Summary
        run: |
          echo "### ✅ Image pushed to ACR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** \`${{ secrets.ACR_REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ secrets.ACR_NAMESPACE }}/mediahub-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Watchtower** triggered to pull and restart on NAS" >> $GITHUB_STEP_SUMMARY
