# Backend Auto Deploy via Alibaba Cloud ACR + Watchtower
# Flow: Build → Push to ACR → Watchtower auto-pulls on NAS
#
# Triggers:
#   - Push to master: builds 'latest' tag
#   - Push version tag (v*): builds versioned release

name: Deploy Backend to ACR

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'docker/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-backend.yml'
    tags:
      - 'v*'

concurrency:
  # Queue successive deploys instead of cancelling the in-flight one.
  #
  # We previously had ``cancel-in-progress: true`` to "always deploy the
  # newest commit fast". In practice that meant: when two PRs landed
  # ~3 min apart, the first PR's build got cancelled mid-way and its
  # changes were silently dropped — we'd think we deployed it because
  # the merge succeeded, but the image never got built. The M3 sequence
  # hit this twice (G build cancelled by J push; F build cancelled by
  # I push). With ``cancel-in-progress: false`` builds queue serially,
  # each one builds master HEAD at its own time, and no commit gets
  # silently dropped.
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-push:
    name: Build and Push to ACR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract version from tag
        id: version
        # Use $GITHUB_REF (env, well-typed) instead of `${{ github.ref }}`
        # so shellcheck can reason about the glob match. The literal form
        # `[[ "${{ github.ref }}" == refs/tags/v* ]]` triggers SC2193 —
        # shellcheck sees an opaque expression and thinks the comparison
        # can never hold. case-on-env is unambiguous.
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*)
              VERSION=${GITHUB_REF#refs/tags/}
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "is_release=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "version=latest" >> "$GITHUB_OUTPUT"
              echo "is_release=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Generate build-info.json (commits since last tag/20 commits)
        run: |
          set -e
          git fetch --unshallow 2>/dev/null || true
          # Find last release tag (fall back to 20 commits if none)
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE="HEAD~20..HEAD"
          fi
          HEAD_SHA=$(git rev-parse --short HEAD)
          export HEAD_SHA
          git log "$RANGE" --pretty=format:'{"sha":"%h","subject":"%s","author":"%an","date":"%aI"}' > /tmp/commits.raw
          python3 <<'PYEOF' > backend/build-info.json
          import json, re, os
          items = []
          with open('/tmp/commits.raw') as f:
              for line in f:
                  line = line.strip()
                  if not line: continue
                  try:
                      o = json.loads(line)
                      m = re.match(r'^(\w+)(\([^)]+\))?!?:', o['subject'])
                      o['type'] = m.group(1) if m else 'other'
                      items.append(o)
                  except Exception:
                      pass
          groups = {}
          for it in items:
              groups.setdefault(it['type'], []).append(it['subject'])
          order = ['feat', 'fix', 'perf', 'refactor', 'docs', 'chore', 'other']
          label = {'feat': '✨ Features', 'fix': '🐛 Fixes', 'perf': '⚡ Performance',
                   'refactor': '♻️ Refactor', 'docs': '📝 Docs', 'chore': '🔧 Chore', 'other': '📦 Other'}
          parts = []
          for t in order:
              if t in groups:
                  parts.append(f"{label[t]} ({len(groups[t])}): " + '; '.join(groups[t][:5]))
          info = {
              'service': 'backend',
              'version': os.environ.get('VERSION', 'latest'),
              'commit_sha': os.environ.get('HEAD_SHA', ''),
              'commit_count': len(items),
              'commits': items,
              'summary': (' | '.join(parts))[:500] if parts else 'No changes',
              'deployed_by': os.environ.get('ACTOR', ''),
              'run_id': os.environ.get('RUN_ID', ''),
          }
          print(json.dumps(info, ensure_ascii=False, indent=2))
          PYEOF
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HEAD_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/mediahub-backend:latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/mediahub-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Watchtower update
        run: |
          echo "🔄 Triggering Watchtower to pull new image..."
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            "${{ secrets.WATCHTOWER_URL }}" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Watchtower triggered successfully"
          else
            echo "⚠️ Watchtower trigger returned HTTP $HTTP_CODE (will auto-poll in 5min)"
          fi

      - name: Verify deploy (poll prod for new commit SHA)
        # Why this step exists:
        # 2026-05-12 lost ~3 hours debugging "downloads broken on prod"
        # while CI reported every deploy as ✅ success. Root cause: the
        # Watchtower webhook endpoint returned 200/504 without actually
        # being a real Watchtower HTTP API (it never had one configured),
        # so "✅ triggered" above was a lie. New image sat in ACR while
        # prod kept running the previous one.
        #
        # This step polls /api/version on the public backend URL and
        # asserts the response carries this build's `github.sha` (short).
        # If prod hasn't picked up the new image within the budget, the
        # job fails LOUDLY — operator knows immediately to investigate
        # the NAS instead of believing "deploy succeeded".
        #
        # Skipped automatically when PROD_VERSION_URL repo var is unset,
        # so it's safe to introduce without breaking forks/PR builds.
        if: github.ref == 'refs/heads/master' && vars.PROD_VERSION_URL != ''
        env:
          PROD_VERSION_URL: ${{ vars.PROD_VERSION_URL }}
          EXPECTED_SHA_FULL: ${{ github.sha }}
        run: |
          # backend's build-info.json stores `git rev-parse --short HEAD`
          # (first 7 hex chars), so compare against that.
          EXPECTED_SHA_SHORT="${EXPECTED_SHA_FULL:0:7}"
          echo "⏳ Polling $PROD_VERSION_URL for commit_sha starting with $EXPECTED_SHA_SHORT..."

          DEADLINE=$(( $(date +%s) + 600 ))   # 10-minute budget
          ATTEMPT=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            RESPONSE=$(curl -sf -m 8 "$PROD_VERSION_URL" 2>/dev/null || echo "")
            # Parse commit_sha out of the JSON response. Using jq (always
            # present on GH runners) avoids embedding a multi-line
            # `python3 -c` heredoc inside the YAML `run: |` block — those
            # continuation lines need column-0 indent to satisfy Python's
            # `try:`/`except:`, but column-0 inside `run: |` makes YAML
            # think they're sibling keys and fails the whole workflow file
            # to parse (broke master after PR #253 was merged on 2026-05-12).
            # `-r` strips quotes, `// ""` defaults null → "" so the
            # following string compare doesn't trip on a JSON null.
            ACTUAL_SHA=$(echo "$RESPONSE" | jq -r '.commit_sha // ""' 2>/dev/null || echo "")
            if [ -n "$ACTUAL_SHA" ] && [ "${ACTUAL_SHA:0:7}" = "$EXPECTED_SHA_SHORT" ]; then
              echo "✅ Prod is on $ACTUAL_SHA after $ATTEMPT probe(s)"
              echo "- **Verified prod SHA:** \`$ACTUAL_SHA\` ✅" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            echo "  attempt $ATTEMPT: prod still on '${ACTUAL_SHA:-<unreachable>}', want '$EXPECTED_SHA_SHORT'"
            sleep 15
          done

          echo "::error::Deploy verify timed out after 10 min. Prod did not pick up commit $EXPECTED_SHA_SHORT."
          echo "## ❌ Deploy NOT verified" >> $GITHUB_STEP_SUMMARY
          echo "Watchtower webhook reported success but prod is still on the previous SHA after 10 minutes." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run on NAS to force-recreate:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "sudo docker compose -f /volume1/docker/mediahub/docker/docker-compose.yml pull mediahub" >> $GITHUB_STEP_SUMMARY
          echo "sudo docker compose -f /volume1/docker/mediahub/docker/docker-compose.yml up -d mediahub" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Summary
        run: |
          echo "### ✅ Image pushed to ACR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** \`${{ secrets.ACR_REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ secrets.ACR_NAMESPACE }}/mediahub-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Watchtower** triggered to pull and restart on NAS" >> $GITHUB_STEP_SUMMARY
