name: Run SQL Migration on NAS

# Two trigger modes:
#  (1) push to master that adds new files under supabase/migrations/** —
#      auto-applies them in alpha-numeric order. Avoids the 2026-05-15
#      incident where PR #283 shipped mig 218 but it never landed in
#      prod and extract_audio_workflow PGRST204-stormed for hours.
#  (2) workflow_dispatch — manual single-file apply (debug / replay).
on:
  push:
    branches: [master]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
    inputs:
      migration_file:
        description: "Path to migration SQL file (relative to repo root, e.g. supabase/migrations/102_add_tags_enabled.sql)"
        required: true
        type: string

jobs:
  migrate:
    name: Execute SQL Migration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need previous commit to diff added migration files on push.
          fetch-depth: 2

      - name: Build batch SQL
        id: collect
        run: |
          set -e
          batch=$(mktemp /tmp/batch-XXXXXX.sql)
          echo "\set ON_ERROR_STOP on" > "$batch"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            file="${{ inputs.migration_file }}"
            if [ ! -f "$file" ]; then
              echo "::error::Migration file not found: $file"
              exit 1
            fi
            echo "Mode: workflow_dispatch (single file)"
            files="$file"
          else
            echo "Mode: push to master (auto-detect new migrations)"
            # Exclude *_rollback.sql — those are reverse migrations that
            # only ever run manually via workflow_dispatch. Auto-applying
            # both a forward and its rollback in the same push undoes the
            # change (see PR #368 / mig 236, where the rollback dropped
            # the freshly-installed teams_sync_is_personal_trg trigger).
            files=$(
              git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'supabase/migrations/*.sql' \
                | grep -Ev '_rollback\.sql$' \
                | sort
            )
            if [ -z "$files" ]; then
              echo "No new migration files added in this push. Exiting clean."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          count=0
          for f in $files; do
            name=$(basename "$f")
            {
              echo ""
              echo "-- ============================================================"
              echo "-- $name"
              echo "-- ============================================================"
              echo "\\echo '>> Applying $name'"
              cat "$f"
              echo ""
              echo "\\echo '<< $name applied'"
            } >> "$batch"
            count=$((count + 1))
          done

          echo ""
          echo "Will apply $count file(s):"
          for f in $files; do echo "  - $f"; done

          {
            echo 'sql_b64<<MIGRATION_EOF'
            base64 < "$batch"
            echo 'MIGRATION_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          rm -f "$batch"

      - name: Run migrations via SSH
        if: steps.collect.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          SQL_B64: ${{ steps.collect.outputs.sql_b64 }}
        with:
          host: ${{ secrets.NAS_HOST }}
          port: ${{ secrets.NAS_PORT }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          command_timeout: 10m
          envs: SQL_B64
          script: |
            set -e
            export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"

            # Container names per the 2026-04 prod-supabase rename:
            #   - DB:   mediahub-sb-prod-db (was: mediahub-sb-db)
            #   - REST: mediahub-sb-prod-rest (was: mediahub-sb-rest)
            # See scripts/rename-prod-supabase.sh + scripts/migrate-prod-data.sh.
            # The PR #283 mig 218 silently "ran" against the old name and
            # the workflow exited green because nobody verified the docker
            # exec output — auto-trigger (PR #293) caught this when mig 219
            # surfaced the stale name. Detect by docker ps so future
            # renames also self-heal.
            DB_CONTAINER=$(sudo docker ps --format '{{.Names}}' \
              | grep -E '^mediahub-sb(-prod)?-db$' | head -1)
            REST_CONTAINER=$(sudo docker ps --format '{{.Names}}' \
              | grep -E '^mediahub-sb(-prod)?-rest$' | head -1)
            if [ -z "$DB_CONTAINER" ]; then
              echo "::error::No running container matching ^mediahub-sb(-prod)?-db$ — list:"
              sudo docker ps --format '{{.Names}}'
              exit 1
            fi
            echo "Using DB container: $DB_CONTAINER"
            echo "Using REST container: ${REST_CONTAINER:-<none found, will skip reload>}"

            TMP=$(mktemp /tmp/mediahub-migration-XXXXXX.sql)
            trap 'rm -f "$TMP"' EXIT

            printf '%s' "$SQL_B64" | base64 -d > "$TMP"
            echo "Decoded batch SQL ($(wc -c < "$TMP") bytes, $(grep -c '^-- ==' "$TMP" | head -1) markers)"

            echo ""
            echo "Running batch via psql (\\set ON_ERROR_STOP on)..."
            sudo docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres < "$TMP"

            echo ""
            if [ -n "$REST_CONTAINER" ]; then
              echo "Reloading PostgREST schema cache ($REST_CONTAINER)..."
              sudo docker kill --signal=SIGUSR1 "$REST_CONTAINER" 2>/dev/null || true
            else
              echo "REST container not found, skipping schema cache reload."
            fi
            echo "Done."

      - name: Skip note
        if: steps.collect.outputs.skip == 'true'
        run: echo "No new migrations in this push. Nothing to apply."
