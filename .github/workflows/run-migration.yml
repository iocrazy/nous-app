name: Run SQL Migration on GPU

# 2026-07-25:目标从 NAS(mediahub-sb-prod-db,经 SSH)改为 gpupc 本机
# (nous-db,self-hosted runner)。生产库已经是 gpupc 上的自托管 Supabase,
# 继续打 NAS 等于 migration 全部落到旧库 —— 恰好是下面 (1) 要防的那类事故的
# 镜像版本。gpupc 无公网 IP(CGNAT)不能反向 SSH,所以走 self-hosted runner。
#
# Two trigger modes:
#  (1) push to master that adds new files under supabase/migrations/** —
#      auto-applies them in alpha-numeric order. Avoids the 2026-05-15
#      incident where PR #283 shipped mig 218 but it never landed in
#      prod and extract_audio_workflow PGRST204-stormed for hours.
#  (2) workflow_dispatch — manual single-file apply (debug / replay).
on:
  push:
    branches: [master]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
    inputs:
      migration_file:
        description: "Path to migration SQL file (relative to repo root, e.g. supabase/migrations/102_add_tags_enabled.sql)"
        required: true
        type: string

jobs:
  migrate:
    name: Execute SQL Migration
    runs-on: [self-hosted, gpu]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need previous commit to diff added migration files on push.
          fetch-depth: 2

      # 合并后巡检：兜住「PR 的 CI 跑完 → 实际 merge」之间的残余窗口。
      # 那段时间里另一个 PR 可能刚合入同号迁移，PR 门禁已经跑过了看不见。
      #
      # 刻意只 warning、不阻断：号已经合进来了，此刻 exit 1 撤销不了重复，
      # 却会让这条迁移永远不落库 —— 代码已部署而 schema 没跟上，比重复号本身
      # 危险得多。这里要的是「立刻可见」，阻断由 PR 门禁负责。
      #
      # 只在 push 触发时跑：workflow_dispatch 是手工单文件重放，HEAD~1 差集
      # 对它没有意义。
      - name: Migration number collision check (post-merge, non-blocking)
        if: github.event_name == 'push'
        run: bash scripts/check-migration-numbers.sh push

      - name: Build batch SQL
        id: collect
        run: |
          set -e
          batch=$(mktemp /tmp/batch-XXXXXX.sql)
          echo "\set ON_ERROR_STOP on" > "$batch"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            file="${{ inputs.migration_file }}"
            if [ ! -f "$file" ]; then
              echo "::error::Migration file not found: $file"
              exit 1
            fi
            echo "Mode: workflow_dispatch (single file)"
            files="$file"
          else
            echo "Mode: push to master (auto-detect new migrations)"
            # Exclude *_rollback.sql — those are reverse migrations that
            # only ever run manually via workflow_dispatch. Auto-applying
            # both a forward and its rollback in the same push undoes the
            # change (see PR #368 / mig 236, where the rollback dropped
            # the freshly-installed teams_sync_is_personal_trg trigger).
            files=$(
              git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'supabase/migrations/*.sql' \
                | grep -Ev '_rollback\.sql$' \
                | sort
            )
            if [ -z "$files" ]; then
              echo "No new migration files added in this push. Exiting clean."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          count=0
          for f in $files; do
            name=$(basename "$f")
            {
              echo ""
              echo "-- ============================================================"
              echo "-- $name"
              echo "-- ============================================================"
              echo "\\echo '>> Applying $name'"
              cat "$f"
              echo ""
              echo "\\echo '<< $name applied'"
            } >> "$batch"
            count=$((count + 1))
          done

          echo ""
          echo "Will apply $count file(s):"
          for f in $files; do echo "  - $f"; done

          {
            echo 'sql_b64<<MIGRATION_EOF'
            base64 < "$batch"
            echo 'MIGRATION_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          rm -f "$batch"

      - name: Run migrations on gpupc (nous-db)
        if: steps.collect.outputs.skip != 'true'
        env:
          SQL_B64: ${{ steps.collect.outputs.sql_b64 }}
        run: |
          set -e

          # self-hosted runner 就在 gpupc 上,直接 docker exec,不再 SSH。
          # heygo 已入 docker 组,无需 sudo(见 deploy/gpu-server/README.md)。
          # 沿用按 docker ps 探测容器名的做法:重命名能自我修复,这是 2026-04
          # NAS 改名后 mig 218 静默打空的教训(PR #283/#293)。
          DB_CONTAINER=$(docker ps --format '{{.Names}}' \
            | grep -E '^nous-db$' | head -1)
          REST_CONTAINER=$(docker ps --format '{{.Names}}' \
            | grep -E '^nous-rest$' | head -1)
          if [ -z "$DB_CONTAINER" ]; then
            echo "::error::No running container matching ^nous-db$ — list:"
            docker ps --format '{{.Names}}'
            exit 1
          fi
          echo "Using DB container: $DB_CONTAINER"
          echo "Using REST container: ${REST_CONTAINER:-<none found, will skip reload>}"

          TMP=$(mktemp /tmp/nous-migration-XXXXXX.sql)
          trap 'rm -f "$TMP"' EXIT

          printf '%s' "$SQL_B64" | base64 -d > "$TMP"
          echo "Decoded batch SQL ($(wc -c < "$TMP") bytes, $(grep -c '^-- ==' "$TMP" | head -1) markers)"

          echo ""
          # -p 55434 是必须的:自托管 Supabase 的 POSTGRES_PORT 喂给了容器内
          # PGPORT,PG 只监听 55434,5432 上没有监听者。省掉这个参数会拿
          # Connection refused —— 同 DBOS_DATABASE_URL 那个坑(见 CLAUDE.md)。
          echo "Running batch via psql (ON_ERROR_STOP on)..."
          docker exec -i "$DB_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -p 55434 -d postgres < "$TMP"

          echo ""
          if [ -n "$REST_CONTAINER" ]; then
            echo "Reloading PostgREST schema cache ($REST_CONTAINER)..."
            docker kill --signal=SIGUSR1 "$REST_CONTAINER" 2>/dev/null || true
          else
            echo "REST container not found, skipping schema cache reload."
          fi
            echo "Done."

      - name: Skip note
        if: steps.collect.outputs.skip == 'true'
        run: echo "No new migrations in this push. Nothing to apply."
