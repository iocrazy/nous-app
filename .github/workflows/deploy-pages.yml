name: Deploy Pages

# 前端 → Cloudflare Pages(app.nous.ink)。GHA 构建 + wrangler 直传预构建产物，
# 直传不消耗 Pages 的 500 构建/月配额(epic C2)。
on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 同 ci.yml：版本唯一来源是 .nvmrc，改版本改那一个文件
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build (target GPU stack)
        env:
          # 大陆入口：nas-A(180.121.75.101):88 灰云直连，绕开 CF 隧道跨境(930ms→~40ms)
          # 老的 CF 隧道入口 api/sb.nous.ink(橙云)保留作海外兜底
          VITE_API_URL: https://cn.nous.ink:88
          VITE_API_FALLBACK_URL: https://api.nous.ink
          VITE_SUPABASE_URL: https://cn-sb.nous.ink:88
          VITE_SUPABASE_FALLBACK_URL: https://sb.nous.ink
          # 生产 feature flags —— 必须与 frontend/.env.production 一致。
          # 本地 `npm run build` 读不到这里的 env，只读 .env.production；两边
          # 漂移会让"本地构建 + wrangler 直传"应急路径产出功能残缺的包。
          #
          # 只保留真正被代码读取的 flag。原先还设了 CONVERSATIONS /
          # PROJECT_WORKSPACE_V2 / PROJECT_WORKBENCH / PROJECT_AI_SUGGEST —
          # 这四个功能已毕业、运行时读取已从代码删除(全仓库仅剩注释与测试
          # stub)，设了没有任何效果，删掉以免误以为它们还在生效。
          VITE_FEATURE_INSPIRATION_NOTES: 'true'
          VITE_FEATURE_CANVAS_NAV: 'true'
          VITE_FEATURE_COLLAB: 'true'
        run: npm run build

      - name: Drop 404.html (Pages SPA — let _redirects+React Router own routing)
        run: rm -f dist/404.html

      - name: Deploy to Cloudflare Pages (direct upload)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy dist --project-name nous-app --branch master --commit-dirty=true
