# Lint GitHub Actions workflow YAML on every PR that touches them.
#
# Why: PR #253 broke master's deploy workflow with a multi-line
# `python3 -c "..."` heredoc inside `run: |`. The Python continuation
# lines (`try:`/`except:`) at column 0 made YAML parse the whole file
# as a malformed map. All 4 follow-up deploy runs (PRs #252-#255)
# silently failed on the ACR-login step because the workflow file
# itself wouldn't parse cleanly. Hotfix in PR #256 unblocked it but
# cost a full CI cycle.
#
# Scope of this gate (kept narrow on purpose):
# - YAML syntax    — block (the actual incident-class regression)
# - actionlint syntax / unknown-action / expression-typo  — block
# - shellcheck *errors*  — block
# - shellcheck info/style/warning  — DON'T block (would gate on the
#   repo's pre-existing tech debt without adding signal)
name: Lint workflows

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      # deploy-paths 覆盖检查要读根 Dockerfile。只监听 workflows 会漏掉
      # 「加了一条 COPY 但没碰 workflow」这个方向 —— 而那正是它要防的缺陷。
      - 'Dockerfile'
      - 'scripts/check-deploy-paths-cover-dockerfile.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - 'Dockerfile'
      - 'scripts/check-deploy-paths-cover-dockerfile.py'

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 断言根 Dockerfile 每条 COPY 的源路径都在 deploy-gpu.yml 的 paths 里。
      # 两份都是**显式清单**,不同步就出现「改了会进镜像的文件却不触发部署」——
      # 不报错、不红灯,只是新代码永远发不出去。本仓已出现四次(gateway 502、
      # browser、admin、tools/codex-daemon),最后一次直到 #2173 才发现。
      #
      # ⚠️ smoke 探针抓不到这一类:镜像正是从触发部署的那个 checkout build 的,
      # 所以「镜像里装的」和「checkout 里有的」必然相等。缺的是**触发**不是内容。
      #
      # 先跑 --selftest:一个恒真的门禁比没有门禁更糟(它给的是虚假的安全感)。
      - name: Deploy paths cover Dockerfile COPY sources (selftest first)
        run: |
          python3 scripts/check-deploy-paths-cover-dockerfile.py --selftest
          python3 scripts/check-deploy-paths-cover-dockerfile.py

      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          # `-shellcheck=...` flag sets the path/args for the bundled
          # shellcheck invocation. Setting --severity=error means we
          # only fail on shellcheck's `error` class — info/warning/
          # style (e.g. SC2086 unquoted variable, SC2129 multi-redirect)
          # are reported but don't fail CI. Adjust upward as the repo's
          # workflow hygiene improves.
          args: -color -shellcheck="shellcheck --severity=error"
