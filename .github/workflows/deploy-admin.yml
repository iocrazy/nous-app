# Admin Panel Deploy to NAS (local build)
# Triggers:
#   - Push to master with admin/ changes
#   - Manual trigger

name: Deploy Admin Panel to NAS

on:
  push:
    branches: [master]
    paths:
      - 'admin/**'
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy on NAS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to NAS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NAS_HOST }}
          port: ${{ secrets.NAS_PORT }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
            cd ${{ secrets.NAS_PROJECT_PATH }}

            echo "📥 Pulling latest code..."
            git fetch origin master
            git reset --hard origin/master

            echo "📂 Adding admin/ to sparse checkout..."
            git sparse-checkout add admin
            ls admin/package.json

            echo "🔨 Building Admin Panel..."
            sudo docker compose -f docker/docker-compose.yml build --no-cache mediahub-admin

            echo "🚀 Restarting Admin Panel..."
            sudo docker compose -f docker/docker-compose.yml up -d --force-recreate mediahub-admin

            echo "🧹 Cleaning up..."
            sudo docker image prune -f

            echo "✅ Admin Panel deployed on port 3097"
