# Admin Panel Deploy via Alibaba Cloud ACR + Watchtower
# Flow: Build → Push to ACR → Watchtower auto-pulls on NAS
#
# Triggers:
#   - Push to master with admin/ changes
#   - Manual trigger

name: Deploy Admin Panel to ACR

# ⚠️ 2026-07-25 退役:同 deploy-backend.yml —— NAS 老线不再自动发布。
#
# 缺口提醒:gpupc 的 nous-admin 是 deploy/gpu-server/docker-compose.yml 里
# 本机 build 的(context: ../../admin),但 deploy-gpu.yml 的 paths 不含
# 'admin/**',所以退役本线之后 admin 改动没有任何自动部署。补齐前提是先解决
# build arg NOUS_ANON_KEY 的来源(compose 里 VITE_SUPABASE_ANON_KEY 取自它,
# CI 环境没有会 build 出空 anon key 的 admin)。在那之前,admin 改动请在机上
# 手动:cd deploy/gpu-server && NOUS_ANON_KEY=<key> docker compose up -d --build admin
on:
  workflow_dispatch:
  # push:
  #   branches: [master]
  #   paths:
  #     - 'admin/**'

concurrency:
  group: deploy-admin
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push to ACR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/mediahub-admin:latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/mediahub-admin:${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.ADMIN_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.ADMIN_SUPABASE_ANON_KEY }}
            VITE_API_URL=${{ secrets.ADMIN_API_URL }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      - name: Trigger Watchtower update
        run: |
          echo "🔄 Triggering Watchtower to pull new image..."
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            "${{ secrets.WATCHTOWER_URL }}" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Watchtower triggered successfully"
          else
            echo "⚠️ Watchtower trigger returned HTTP $HTTP_CODE (will auto-poll in 5min)"
          fi

      - name: Summary
        run: |
          echo "### ✅ Admin image pushed to ACR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** \`${{ secrets.ACR_REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ secrets.ACR_NAMESPACE }}/mediahub-admin:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Watchtower** triggered to pull and restart on NAS" >> $GITHUB_STEP_SUMMARY
