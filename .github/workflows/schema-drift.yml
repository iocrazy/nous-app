          # 正是血缘要回答的那个问题）。顺带钉住并发回退：SQLSTATE 23505 必须以
          # `IntegrityError.orig.sqlstate` 的形状到达，否则那个 409 退化成 500。
          bash "$GITHUB_WORKSPACE/.github/scripts/pytest-no-full-skip.sh" tests/db/test_revert_output_integration.py -v
          # The ONLY place last_transcript_seq / output_keys_for_run execute.
          # Both are aggregates, which is the shape a stubbed session cannot
          # vouch for: whether MAX(seq) over an empty run comes back as None
          # rather than raising or reading 0 ("no events" and "seq 0" are
