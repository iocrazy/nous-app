# Schema-Drift Gate — build the schema in an ephemeral Postgres, then diff it
# against the SQLAlchemy ORM models.
#
# ─────────────────────────────────────────────────────────────────────────
# WHAT THIS DOES
# ─────────────────────────────────────────────────────────────────────────
#   1. Boot a throwaway Postgres 17 (matches prod's 17.6).
#   2. supabase/ci_bootstrap.sql    — stub the objects Supabase/DBOS create at
#                                     runtime (auth schema, roles, extensions…).
#   3. supabase/schema_baseline.sql — prod's real applied public schema, as of
#                                     the watermark recorded in its header.
#   4. Apply ONLY migrations numbered ABOVE that watermark (*_rollback.sql
#      excluded — those only ever run manually).
#   5. Run backend/tests/db/test_schema_drift.py against the result.
#
# So a migration that changes the schema without the models being regenerated
# fails HERE — on the PR, before it ever reaches prod.
#
# ─────────────────────────────────────────────────────────────────────────
# WHY BASELINE + INCREMENT (AND NOT "REPLAY ALL MIGRATIONS")
# ─────────────────────────────────────────────────────────────────────────
# Because replaying them does not rebuild prod, and cannot: the file numbering
# is NOT the order in which these migrations reached prod, and several are
# invalid as committed. Measured 2026-07-15 — a full in-order replay lands at
# ~346/371 applied and produces a database with `unified_tasks` and NO
# `task_tracking`, i.e. the opposite of prod on the single most important table.
# Diffing models against that would be confidently wrong. The long-form
# evidence is at the top of supabase/schema_baseline.sql.
#
# ─────────────────────────────────────────────────────────────────────────
# ZERO SECRETS — AND NO SILENT SKIPS
# ─────────────────────────────────────────────────────────────────────────
# Everything this job needs is committed to the repo, so it runs identically on
# forks. It touches NO production system and needs NO secret.
#
# This replaced a gate that reported green for months without checking anything:
# its final step read `if [ -z "$PROD_DB_PASSWORD" ]; then ... exit 0; fi`, and
# that secret was never configured. A guard that silently no-ops is worse than
# no guard — it manufactures the impression of coverage.
#
# THEREFORE, THE RULE FOR THIS FILE: there is no "can't run → pass" path.
# Every failure mode (Postgres won't boot, bootstrap fails, the baseline won't
# apply, a migration errors, the watermark can't be parsed) is RED. Do not add
# `continue-on-error`, `|| true`, or a conditional `exit 0` to any step here.
#
# THAT RULE APPLIES TO THE PYTEST STEPS TOO — and for a long time it did not.
# `pytest` exits 0 when every test in a file skips, and every integration file
# below skips itself (module-level or per-case) when INTEGRATION_DATABASE_URL
# is unset. A bare `uv run pytest <file>` step therefore went GREEN while
# asserting nothing: the same "manufactured impression of coverage" this
# workflow replaced, one layer down. So EVERY integration step below runs
# through .github/scripts/pytest-no-full-skip.sh, which fails the step when the
# summary reports zero passing tests. Adding a new integration step here means
# calling that script — never a bare `uv run pytest`.

name: Schema Drift (models vs baseline + migrations)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/app/models/**'
      - 'supabase/migrations/**'
      - 'supabase/schema_baseline.sql'
      - 'supabase/ci_bootstrap.sql'
      - 'backend/tests/db/test_schema_drift.py'
      - 'backend/tests/db/test_assets_repository_integration.py'
      - 'backend/tests/db/test_canvas_asset_refs_integration.py'
      - 'backend/tests/db/test_conversations_store_question_integration.py'
      - 'backend/tests/db/test_inbox_expire_skips_paused_integration.py'
      # The statements that integration file executes (phase 2a question stamp).
      - 'backend/app/services/ai/chat/conversations_ai_store.py'
      - 'backend/app/repositories/agent_run_inbox_repository.py'
      # ⚠️ COVERAGE GAP, STATED PLAINLY. This entry was added because the
      # project-entity migration workflow imported `_NOT_MARKABLE` and
      # `_resources_with_asset_files_stmt` from this module, and the step that
      # ran that workflow (`_run_extra_steps` -> `_map_generated_media`) was
      # the ONE place `_resources_with_asset_files_stmt()` actually executed
      # against a real Postgres. Mig 451 deleted that workflow and its step, so
      # NO step in this job executes those definitions any more — the surviving
      # test only COMPILES the statement against a stubbed session. The entry
      # stays so a change here still triggers the schema build below rather
      # than silently losing its only gate, but do not read a green run as
      # "the server accepted this statement". The mig-450 step added by #2108
      # does NOT close this: it exercises chat_upload.py, not this module
      # (checked — no step file imports `backfill_generated_inbox`). Closing
      # the gap means giving it its own live integration case here.
      - 'backend/app/workflows/backfill_generated_inbox.py'
      # The chat-uploads folder is identified by `system_key`, and the
      # criterion the backfill joins on lives in chat_upload.py. Migration 450
      # backfills that identity, and its candidate predicate must stay
      # identical to the one in chat_upload.py — so a change to either has to
      # reach this chain. ⚠️ Unlike the entry ABOVE, this one IS executed live:
      # the mig-450 step runs `_ensure_chat_uploads_folder` against the built
      # schema. Do not read the two comments as making the same promise.
      - 'backend/app/services/library/chat_upload.py'
      - 'backend/tests/db/test_chat_uploads_folder_migration.py'
      - 'backend/app/repositories/assets_repository.py'
      - 'backend/app/repositories/asset_relations_repository.py'
      - 'backend/app/repositories/canvas_asset_refs_repository.py'
      # The prompt catalog's OTHER half (templates come from
      # assets_repository above). Its membership rule IS has_prompt_expr,
      # which lives in media_repository — a change to either can only be
      # settled by running it, so both entries point at the same step.
      - 'backend/app/repositories/prompt_catalog_repository.py'
      - 'backend/app/repositories/media_repository.py'
      - 'backend/tests/db/test_prompt_catalog_repository_integration.py'
      - 'backend/app/services/assets/**'
      # The canvas→asset mirror is written by CanvasService on save and rebuilt
      # by the backfill; both are exercised by the E2 case below, so a change to
      # either has to reach this chain — the ON CONFLICT arm and the
      # array_agg(DISTINCT) can only be settled by a real Postgres.
      - 'backend/app/services/canvas/asset_node_refs.py'
      - 'backend/app/services/canvas/canvas_service.py'
      - 'backend/scripts/backfill_canvas_asset_refs.py'
      - '.github/workflows/schema-drift.yml'
      # The full-skip guard every integration step below runs through. A change
      # to it changes what "green" means for all ten, so it has to re-run
      # them — otherwise the guard could be weakened by a PR this job ignores.
      # ⚠️ That count has been wrong twice (it said "eight" when there were
      # seven, then "nine" when there were eight — each edit trusted the
      # previous number instead of counting). Recount, do not increment:
      #   grep -cE '^\s*bash .*pytest-no-full-skip\.sh" tests/' .github/workflows/schema-drift.yml
      - '.github/scripts/pytest-no-full-skip.sh'
  push:
    branches: [master]
    paths:
      - 'backend/app/models/**'
      - 'supabase/migrations/**'
      - 'supabase/schema_baseline.sql'
      - 'supabase/ci_bootstrap.sql'

permissions:
  contents: read

concurrency:
  group: schema-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Build ephemeral schema & diff ORM models
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector/pgvector rather than supabase/postgres: the supabase image's
        # entrypoint expects the full platform environment and is not built to
        # run as a bare service container. Its advertised advantage (bundled
        # roles/extensions) does not apply either — auth.users is created by
        # gotrue at RUNTIME, not by the image, and the baseline has 70 FKs to
        # it, so ci_bootstrap.sql must provide it regardless. Given that, the
        # smaller image that pins prod's major version is the better trade.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drift
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: drift

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          # 同 ci.yml：版本唯一来源是 .python-version（3.13），不在此重抄一份
          python-version-file: .python-version

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install psql client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Wait for Postgres
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if pg_isready -q; then
              echo "Postgres ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres service did not become ready within 30s"
          exit 1

      - name: Apply ci_bootstrap.sql (runtime-owned stubs)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f supabase/ci_bootstrap.sql
          echo "Bootstrap applied."

      - name: Apply schema_baseline.sql (prod's applied schema)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f supabase/schema_baseline.sql
          count=$(psql -tAc "SELECT count(*) FROM information_schema.tables
                             WHERE table_schema='public' AND table_type='BASE TABLE';")
          echo "Baseline applied — ${count} public BASE TABLEs."
          # A baseline that applies but yields almost nothing means the file is
          # truncated or corrupt. Fail loudly rather than diff against a stub.
          if [ "$count" -lt 100 ]; then
            echo "::error::Baseline produced only ${count} tables — expected >=100. Corrupt or truncated?"
            exit 1
          fi

      - name: Apply migrations newer than the baseline watermark
        run: |
          set -euo pipefail

          # The watermark lives in the baseline header:
          #   --   BASELINE WATERMARK: 364
          watermark=$(grep -m1 -oE '^--[[:space:]]+BASELINE WATERMARK:[[:space:]]*[0-9]+' \
                        supabase/schema_baseline.sql | grep -oE '[0-9]+$' || true)
          if [ -z "$watermark" ]; then
            echo "::error::Could not parse 'BASELINE WATERMARK: <n>' from supabase/schema_baseline.sql."
            echo "The gate cannot know which migrations to apply. Fix the header."
            exit 1
          fi
          echo "Baseline watermark: ${watermark}"

          # Forward migrations numbered strictly above the watermark, in numeric
          # order. *_rollback.sql are reverse migrations — manual-only, never
          # auto-applied (same rule as run-migration.yml).
          files=$(
            ls supabase/migrations \
              | grep -E '^[0-9]{3}_.*\.sql$' \
              | grep -Ev '_rollback\.sql$' \
              | awk -F_ -v w="$watermark" '$1 + 0 > w' \
              | sort
          )

          if [ -z "$files" ]; then
            # Not a skip: the baseline IS the schema under test, and the drift
            # test still runs against it in the next step.
            echo "No migrations newer than watermark ${watermark}; testing the baseline as-is."
            exit 0
          fi

          echo "Applying $(echo "$files" | wc -l) migration(s) above the watermark:"
          for f in $files; do echo "  - $f"; done

          for f in $files; do
            echo ">> $f"
            psql -v ON_ERROR_STOP=1 -q -f "supabase/migrations/$f"
          done
          echo "All incremental migrations applied."

      - name: Diff ORM models against the built schema
        working-directory: backend
        env:
          # asyncpg.connect() wants a plain libpq DSN (the test uses asyncpg
          # directly, not SQLAlchemy) — no '+asyncpg' driver suffix here.
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/drift
        run: |
          set -euo pipefail
          # Drift → the test fails → this step fails → the job is RED. That is
          # the entire point of the gate. Known, registered drift is handled by
          # the ratchet allowlists inside the test itself.
          bash "$GITHUB_WORKSPACE/.github/scripts/pytest-no-full-skip.sh" tests/db/test_schema_drift.py -v

      - name: Assert social_accounts' Realtime/RLS + credential grants (mig 417)
        working-directory: backend
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/drift
        run: |
          set -euo pipefail
          # Runs here rather than in ci.yml because these assertions need a real
          # Postgres with the migrations applied — exactly what this job already
          # built. Named explicitly (not a directory glob) for the same reason
          # the step above is: a test file that silently stops being collected
          # is the failure mode this whole workflow exists to prevent.
          bash "$GITHUB_WORKSPACE/.github/scripts/pytest-no-full-skip.sh" tests/db/test_social_accounts_realtime_rls.py -v

      - name: Assert the publish read-back schema + sweep SQL (mig 418)
        working-directory: backend
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/drift
        run: |
          set -euo pipefail
          # P1-3's SQL is the part unit tests cannot vouch for: a correlated
          # array_agg subquery and a NULLS FIRST ordering both COMPILE happily
          # under SQLAlchemy and can still be rejected by the server. These
          # execute them for real against the schema this job just built.
          bash "$GITHUB_WORKSPACE/.github/scripts/pytest-no-full-skip.sh" tests/db/test_publish_readback_db.py -v

      - name: Assert the asset-library schema's RLS, partial indexes & CHECKs (mig 445/446)
        working-directory: backend
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/drift
        run: |
          set -euo pipefail
          # Complements (does not duplicate) the drift test above: RLS being on
          # with a service_role-only policy, the WHERE predicates that make
          # uq_assets_scope_type_name / uq_loadout_default partial, and the
          # CHECK bodies are all invisible to a model-vs-schema diff — drop the
          # predicate and the drift test still passes while a soft-deleted row
          # squats its name forever.
          bash "$GITHUB_WORKSPACE/.github/scripts/pytest-no-full-skip.sh" tests/migrations/test_445_asset_library_core.py -v

      - name: Exercise the asset-library repositories against the built schema (mig 445/446)
        working-directory: backend
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/drift
        run: |
          set -euo pipefail
          # The ONLY place the two asset repositories' ORM statements actually
          # execute. Their unit tests stub the session, so nothing else proves
          # that asyncpg's IntegrityError names uq_assets_scope_type_name, that
          # UPDATE...RETURNING(Assets) yields an entity, that the partial unique
          # indexes free/hold names, that ON CONFLICT finds the real index, or
          # that a raise inside unit_of_work() rolls the whole batch back.
          bash "$GITHUB_WORKSPACE/.github/scripts/pytest-no-full-skip.sh" tests/db/test_assets_repository_integration.py -v

      - name: Exercise the canvas→asset ref mirror against the built schema (mig 445)
        working-directory: backend
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/drift
        run: |
          set -euo pipefail
          # The ONLY place CanvasAssetRefsRepository's ORM statements execute.
          # Three properties are invisible to a stubbed session: that
          # ON CONFLICT (canvas_id, asset_id, node_id) DO UPDATE SET loadout_id
          # finds the real PK and actually refreshes a re-saved node's loadout
          # (DO NOTHING would keep the stale one and still report success),
          # that array_agg(DISTINCT ...) really dedupes (two nodes sharing one
          # loadout must contribute that id once), and that the scope filter's
          # COALESCE resolves a personal project through a real LEFT JOIN on
          # teams — a canvas invisible to its own owner would read as "this
          # asset is used nowhere".
          bash "$GITHUB_WORKSPACE/.github/scripts/pytest-no-full-skip.sh" tests/db/test_canvas_asset_refs_integration.py -v

      - name: Exercise the chat question stamp against the built schema (phase 2a)
        working-directory: backend
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/drift
        run: |
          set -euo pipefail
          # The ONLY place ConversationsAiStore's phase-2a statements execute.
          # A stubbed session cannot show that the newest-agent-message SELECT
          # returns the row the store expects, or that the level-by-level ||
          # merge actually lands the answered stamp when an intermediate key
          # is missing (jsonb_set would return the target unchanged, rowcount 1).
          bash "$GITHUB_WORKSPACE/.github/scripts/pytest-no-full-skip.sh" tests/db/test_conversations_store_question_integration.py -v

      - name: Exercise the paused-issue inbox sweep exclusion against the built schema (phase 2a)
        working-directory: backend
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/drift
        run: |
          set -euo pipefail
          # The ONLY place expire_stale_stmt(skip_paused_issues=True) executes.
          # Its compile test greps the SQL; only Postgres can settle that
          # NOT (kind='issue' AND id IN (SELECT ... WHERE paused_at IS NOT NULL))
          # leaves paused-issue items alone while still expiring the other
          # old orphans (non-issue targets included) and never collapses to
          # "expire nothing".
          bash "$GITHUB_WORKSPACE/.github/scripts/pytest-no-full-skip.sh" tests/db/test_inbox_expire_skips_paused_integration.py -v

      - name: Exercise the chat-uploads folder adoption (mig 450)
        working-directory: backend
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/drift
        run: |
          set -euo pipefail
          # Migration 450 is a single UPDATE whose whole value is in what it
          # does NOT touch: it must adopt exactly one `temp` folder per scope
          # (the oldest, root-level, unkeyed one), leave the rest as plain user
          # folders, and change zero rows on a second run. None of that is
          # checkable without a server — DISTINCT ON, the NOT EXISTS guard and
          # the partial unique index that backs it all only exist in Postgres.
          # The same step also runs the code-side adoption against the real
          # index, which is what proves the migration and `chat_upload.py`
          # agree instead of each minting a row.
          bash "$GITHUB_WORKSPACE/.github/scripts/pytest-no-full-skip.sh" tests/db/test_chat_uploads_folder_migration.py -v

      - name: Exercise the prompt-catalog repository against the built schema (mig 455)
        working-directory: backend
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/drift
        run: |
          set -euo pipefail
          # The ONLY place PromptCatalogRepository's ORM statements execute.
          # Its other test compiles them and greps the SQL text, which cannot
          # settle any of: what has_prompt_expr()'s btrim/JSONB clause tree
          # actually admits (a whitespace-only prompt must be OUT, a
          # slide_prompts map with no gen_prompt must be IN — that pair IS the
          # catalog's membership rule), whether DISTINCT really collapses the
          # resource_items fan-out (without it one prompt renders twice),
          # whether slot='examples' really partitions a template's thumbnails
          # from its cover and reference files, or whether the eleven projected
          # columns — prompt_origin among them — all exist.
          bash "$GITHUB_WORKSPACE/.github/scripts/pytest-no-full-skip.sh" tests/db/test_prompt_catalog_repository_integration.py -v
