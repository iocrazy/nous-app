      - name: Exercise the turn-done watermark reads against the built schema (3b Task 4b)
        working-directory: backend
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/drift
        run: |
          set -euo pipefail
          # 上一步问「466 的 CHECK 拦不拦得住坏行」；这一步问「回退真的写出来的那些
          # 行过不过得了」——同一批约束的另一面，而且是唯一一个会改**用户内容**的
          # 产出写入方。单测把 session / 账本 / 登记口全桩掉了，所以只有这里能回答：
          # 带 `FOR UPDATE` 的列表 SELECT、`run_id NULL + actor` 的账本行过不过
