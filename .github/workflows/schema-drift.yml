          # the oldest), whether GROUP BY kind, ref_id really collapses two
          # versions of one object into one cache key, and whether
          # ORDER BY MIN(seq) puts a not-yet-stamped registration (seq is
          # NULLABLE — the registry back-fills it) last instead of dropping it.
          bash "$GITHUB_WORKSPACE/.github/scripts/pytest-no-full-skip.sh" tests/db/test_run_seq_and_output_keys_integration.py -v
