name: Deploy GPU

# GPU 服务器部署链(P1):self-hosted runner 本机 pull+build+up,不过 ACR/Watchtower
# NAS 链路(deploy-backend.yml)保持双轨,P4 退役
on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'nous-core/**'
      - 'Dockerfile'
      - 'deploy/gpu-server/**'
      # 会话通道的浏览器执行器(spec 2026-08-04-distribution-session-channel)。
      # 与 backend 同栈同 job:两者靠 BROWSER_SERVICE_URL + 共享 token 强耦合,
      # 分开部署会出现"新 backend 打老 browser"的中间态。
      - 'browser/**'
  workflow_dispatch:

concurrency:
  group: deploy-gpu
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 40
    steps:
      # 用 runner 自己的 workspace,不再借用开发目录(2026-07-25 改)。
      # 旧做法是 `cd /media/.../repos/nous-app && git reset --hard origin/master`,
      # 三个问题:
      #  1. 抹掉那个目录里未提交的改动 —— 而触发者可能是另一台机器的 merge,
      #     人在 gpupc 上写代码却毫无预警(reflog 没法救未提交内容)
      #  2. 反过来,若未提交改动与 master 冲突,`git checkout master` 会被 git 拒绝
      #     → 部署失败。等于"有人在写代码"和"能不能发版"耦合在一起
      #  3. reset 到的是"执行那一刻的 origin/master",不是触发本 job 的 commit。
      #     两次 merge 挨得近时,前一个 job 会部署后一个的代码,日志与现实不符
      # actions/checkout 默认取触发 job 的确切 SHA,三个问题一起消失。
      # 兼容性已验:compose project 名仍由目录名 `gpu-server` 决定(不变,不会
      # 建重复容器);up.sh 用 `cd "$(dirname "$0")"`;marker/env_file/volumes
      # 全是绝对路径;build context `../..` 在任何 checkout 下同样成立。
      - uses: actions/checkout@v4

      # smoke 失败时要能退回上一个镜像,所以先留锚点。
      # `|| true`:首次部署时对应的 :local 还不存在。
      # ⚠️ 本 job 会换掉的**每一个**自建镜像都必须在这里留锚点,否则回滚只回一半。
      # 加新服务要同步本文件的四处:① 这里的锚点 ② `up.sh --build` 清单
      # ③ smoke 的真探针 ④ 回滚步骤的 `up.sh` 清单。四处都是显式清单,漏了不报错。
      - name: Tag current images as rollback point
        run: |
          docker tag nous-backend:local nous-backend:rollback || true
          docker tag nous-browser:local nous-browser:rollback || true

      - name: Build & restart backend stack
        run: |
          cd "$GITHUB_WORKSPACE/deploy/gpu-server"
          # gateway 必须在列:2026-07-27 事故 —— compose 加了 gateway 服务但
          # 此处显式清单没带它,backend 让出 10.0.0.10:8080 而网关无人创建,
          # cn.nous.ink 入口 502 约 5 分钟(手动 up -d gateway 恢复)。
          # browser 同理:清单是显式的,漏了就永远起不来也不会报错。
          ./up.sh --build backend worker gateway browser

      # 探 /api/v1/readyz 而不是 /health —— /health 返回硬编码
      # {"status":"healthy"},DBOS 挂了照样 200,2026-07-22 的 3 天静默故障就是
      # 从这里放行的。readyz 会在 DBOS 配了 DSN 却没起来时 503。
      # 同时验 worker:worker 唯一职责是消费 DBOS 队列,原先完全不在验收范围内。
      - name: Smoke readyz (backend + worker + browser)
        id: smoke
        run: |
          for c in nous-backend nous-worker; do
            ok=0
            for i in $(seq 1 40); do
              if docker exec "$c" curl -fsS http://localhost:8080/api/v1/readyz >/dev/null 2>&1; then
                echo "$c: ready"
                docker exec "$c" curl -sS http://localhost:8080/api/v1/readyz | head -c 200; echo
                ok=1; break
              fi
              sleep 3
            done
            if [ "$ok" != 1 ]; then
              echo "::error::$c never reached ready — readyz kept failing"
              docker exec "$c" curl -sS http://localhost:8080/api/v1/readyz | head -c 500 || true
              echo ""
              docker logs --tail 80 "$c"
              exit 1
            fi
          done

          # browser 的探针独立一段:端口(8090)、路径(/healthz)、工具都不同
          # (playwright/python 基础镜像不保证有 curl,用 python3 urllib)。
          # 必须验:backend 全绿而 browser 挂掉时,发布链路是坏的但现有探针一路
          # 放行 —— 正是 2026-07-22「探针没探真信号,静默 3 天」的同款形态。
          # 轮次给到 60×3s=180s:冷启动要拉 Xvfb + 预热 chromium,比 API 慢。
          ok=0
          for i in $(seq 1 60); do
            if docker exec nous-browser python3 -c \
                 "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=15).status==200 else 1)" \
                 >/dev/null 2>&1; then
              echo "nous-browser: ready"
              docker exec nous-browser python3 -c \
                "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=15).read()[:200].decode())" || true
              ok=1; break
            fi
            sleep 3
          done
          if [ "$ok" != 1 ]; then
            echo "::error::nous-browser never reached ready — /healthz kept failing"
            docker logs --tail 80 nous-browser
            exit 1
          fi

      # up.sh 在 smoke 之前就把容器换成了新镜像,所以 smoke 失败 == 此刻生产是坏的。
      # 退回锚点镜像,让"发布失败"不等于"生产不可用"。只在 smoke 失败时触发:
      # build 阶段失败的话容器根本没被替换,回滚是多余的重启。
      - name: Rollback to previous images on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          if ! docker image inspect nous-backend:rollback >/dev/null 2>&1; then
            echo "::error::无回滚镜像(首次部署?) —— 生产可能仍处于失败状态,需人工介入"
            exit 1
          fi
          docker tag nous-backend:rollback nous-backend:local
          # browser 单独判断:它比 backend 晚引入,存在"backend 有锚点而 browser
          # 是首次构建"的过渡态。这时把 backend 退回去、browser 留在新镜像是
          # 正确的 —— 没有可退的旧 browser,而它的存在不影响 backend 恢复。
          SERVICES="backend worker"
          if docker image inspect nous-browser:rollback >/dev/null 2>&1; then
            docker tag nous-browser:rollback nous-browser:local
            SERVICES="$SERVICES browser"
          else
            echo "::warning::nous-browser 无回滚锚点(首次部署?),仅回滚 backend/worker"
          fi
          cd "$GITHUB_WORKSPACE/deploy/gpu-server"
          # shellcheck disable=SC2086  # 有意做词分割,SERVICES 是服务名列表
          ./up.sh $SERVICES               # 不带 --build:直接用锚点镜像
          echo "::warning::已回滚到上一个镜像;本次 commit 的代码未生效"
          for c in nous-backend nous-worker; do
            for i in $(seq 1 30); do
              if docker exec "$c" curl -fsS http://localhost:8080/api/v1/readyz >/dev/null 2>&1; then
                echo "$c: 回滚后 ready"; break
              fi
              sleep 3
            done
          done
          for i in $(seq 1 40); do
            if docker exec nous-browser python3 -c \
                 "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=15).status==200 else 1)" \
                 >/dev/null 2>&1; then
              echo "nous-browser: 回滚后 ready"; break
            fi
            sleep 3
          done
