# CI - Pull Request Quality Checks
# Runs on every PR to master: frontend build, backend lint, Rust check

name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Build
    # fork PR 一律跳过。本仓库是 public，而下面的 runner 是生产部署机 ——
    # 让 fork 里的代码在上面执行等于把机器交给任何人（GitHub 官方对
    # public repo + self-hosted runner 的警告就是这条）。宁可 fork PR
    # 没有 CI，也不开这个口子。
    if: github.event.pull_request.head.repo.full_name == github.repository
    # self-hosted，不是 ubuntu-latest。2026-08-06：账户付款失败让所有托管
    # runner 的 job 在 2 秒内 fail（runner_name 为空、steps=0，annotation 写着
    # "recent account payments have failed"），CI 完全失去守卫能力。
    #
    # ⚠️「切 public 就能解」这条旧经验这次不成立 —— repo 已经是 public 仍被拦，
    # 说明是付款方式本身失败，不是免费额度用尽。self-hosted 不计费，同期
    # deploy-gpu 三次全 success 可证它不受影响。
    #
    # 代价：只有一个 runner，三个 job 由并行变串行，且与 deploy-gpu 争用。
    # 计费恢复后切回：三处 runs-on 改成 ubuntu-latest 即可，if 守卫留着无害。
    runs-on: [self-hosted, gpu]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 读 .nvmrc，不写死。曾是 CI 验 node 20 而 deploy-pages 用 22 构建
          # 出货产物 —— 门禁跑的和线上跑的不是同一个 major，验过的等于没验。
          # 仓库此前既无 .nvmrc 也无 package.json engines，无处对齐。
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Hooks gate: rules-of-hooks violations shipped to prod before (#1094,
      # early-return-then-useState = React #310). Blocking on error; the
      # exhaustive-deps rule reports as warning only.
      - name: ESLint (react-hooks gate)
        run: npm run lint

      # Non-blocking: surfaces pre-existing type errors in PR output without
      # breaking CI. Flip to a required step once the backlog is cleared.
      - name: TypeScript check
        run: npm run typecheck
        continue-on-error: true

      - name: No zinc utilities (ink migration guard)
        run: bash scripts/check-no-zinc.sh

      - name: Build (includes TypeScript check)
        run: npm run build

      # Phase S (S1) + P1 fix: vitest is now BLOCKING. 52/52 tests pass
      # locally as of this commit; failures must be addressed not ignored.
      - name: Vitest unit tests
        run: npx vitest run --reporter=default

  backend:
    name: Backend Lint & Deps
    # 同 frontend job：fork 守卫 + self-hosted 的理由见那里的注释
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, gpu]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so the diff against the PR base branch
          # can find the merge-base. Without this we can't compute
          # the changed-files set and the lint scope falls back to
          # everything (or fails to find origin/<base>).
          fetch-depth: 0

      # migration 取号查重。放在 backend job 而不是新开 workflow：这个 job
      # 已经有 fork 守卫 + self-hosted + checkout，而只有一个 runner，多一个
      # job 就是多一次串行 checkout。放在 setup-uv 之前，几百毫秒就出结果，
      # 不用等装依赖。
      #
      # ⚠️ 脚本内部会自己 `git fetch origin <base>` 拿 CI 运行这一刻的 master，
      # 不看 merge-base —— 理由写在脚本头部，那正是 2026-08-09 连撞两次的窗口。
      - name: Migration number collision check
        working-directory: ${{ github.workspace }}
        run: bash scripts/check-migration-numbers.sh pr "${{ github.base_ref }}"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          # 缓存必须落在**跨 job 存活**的地方。默认 setup-uv 把
          # UV_CACHE_DIR 指向 `_work/_temp/setup-uv-cache`，而 `_temp`
          # 每个 job 开始时都会被清空 —— 于是这台构建机上明明有一份完整
          # 的 uv 缓存，CI 却一次都用不上，每轮都从 PyPI 从零重下几百 MB。
          # 2026-08-07 连挂三轮（virtualenv / dbos / posthog 各卡一次）
          # 的直接原因就是这个。
          #
          # runner.tool_cache 在 self-hosted 上跨 job 持久（正是我们要的），
          # 在托管 runner 上是 /opt/hostedtoolcache、每次新建，所以这样写
          # 切回 ubuntu-latest 也不会坏，只是回到"无缓存"的旧行为。
          enable-cache: true
          cache-local-path: ${{ runner.tool_cache }}/uv-cache

      - uses: actions/setup-python@v5
        with:
          # 读 .python-version，不写死版本号。写死过 "3.12"，而 .python-version
          # 是 3.13、Dockerfile 也 pin 在 python:3.13-slim —— CI 于是在一个生产
          # 从不使用的解释器上做 lint 和依赖解析，绿了却什么也没保证。
          # requires-python = ">=3.12" 是下限不是锁，拦不住这种漂移。
          # 路径相对 workspace 根：defaults.working-directory 只作用于 run 步骤。
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen

      # Lint scope: only Python files this PR added / modified / renamed
      # under backend/. Computed from the merge-base diff with the PR
      # base branch — running the full-tree lint on every PR is unfair
      # when master carries pre-existing format debt (any PR would be
      # red through no fault of its author).
      - name: Compute changed Python files
        id: changed
        working-directory: ${{ github.workspace }}
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true
          # --diff-filter=AMR: Added, Modified, Renamed (skip Deleted —
          # nothing to lint on a removed file).
          # Pathspec scopes to backend/ then we filter .py via grep —
          # the `**/*.py` pathspec form skips files at depth 1 (e.g.
          # tests/foo.py directly under tests/), which is wrong.
          CHANGED=$(git diff --name-only --diff-filter=AMR \
            "origin/${{ github.base_ref }}...HEAD" \
            -- 'backend/app/**' 'backend/tests/**' \
            | grep -E '\.py$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No backend Python files changed in this PR."
            echo "files=" >> "$GITHUB_OUTPUT"
          else
            # Strip backend/ prefix so the paths work in subsequent
            # steps that run with working-directory: backend.
            RELATIVE=$(echo "$CHANGED" | sed 's|^backend/||' | tr '\n' ' ')
            echo "files=$RELATIVE" >> "$GITHUB_OUTPUT"
            echo "Changed files: $RELATIVE"
          fi

      - name: Check code formatting (black)
        if: steps.changed.outputs.files != ''
        run: uv run black --check ${{ steps.changed.outputs.files }}

      - name: Check import ordering (isort)
        if: steps.changed.outputs.files != ''
        run: uv run isort --check-only ${{ steps.changed.outputs.files }}

      - name: Lint (flake8)
        if: steps.changed.outputs.files != ''
        run: uv run flake8 ${{ steps.changed.outputs.files }}

      - name: Run tests (pytest)
        env:
          # Dummy values so `get_async_supabase_admin()` guard passes at import.
          # Actual Supabase calls are patched at the test layer; the admin
          # client init itself just needs URL+key to be non-empty.
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: dummy_service_role_key_for_ci
          SUPABASE_ANON_KEY: dummy_anon_key_for_ci
        run: uv run pytest tests/ -v --tb=short

  rust:
    name: Rust Check
    # 同 frontend job：fork 守卫 + self-hosted 的理由见那里的注释
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, gpu]
    # ⚠️ 把 rust 工具链关进 runner 的 tool cache，别碰 runner 用户的 home。
    #
    # 迁到 self-hosted 后第一次跑 rust job，就把开发者的 ~/.cargo/bin/rustup
    # 二进制弄没了 —— 那目录下 cargo / cargo-clippy 都是指向 rustup 的符号
    # 链接，rustup 一丢，本机 `cargo` 直接 command not found（~/.rustup/
    # toolchains 里的实体反而完好）。托管 runner 上这类破坏无所谓，机器用完
    # 就销毁；self-hosted 的 home 是活人在用的。
    #
    # 具体做法见下面第一个 step —— 注意不能写成 job 级 `env:` 配
    # ${{ runner.tool_cache }}：runner context 在 job 级 env 里不可用
    # （那里只认 github/inputs/matrix/needs/secrets/strategy/vars），
    # actionlint 会直接拒绝。
    defaults:
      run:
        working-directory: nous-core

    steps:
      - uses: actions/checkout@v4

      # $RUNNER_TOOL_CACHE 是 runner 自动导出的环境变量（托管 runner 上是
      # /opt/hostedtoolcache），在 shell 里取得到，所以这样写切回
      # ubuntu-latest 也不会坏。写进 $GITHUB_ENV 后对后续所有 step 生效。
      - name: Keep the rust toolchain out of the runner user's home
        run: |
          echo "CARGO_HOME=$RUNNER_TOOL_CACHE/rust/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TOOL_CACHE/rust/rustup" >> "$GITHUB_ENV"

      # nous-core 是 pyo3 扩展，编译时要链接一个具体的 CPython。不指定的话
      # pyo3 的 build script 去 PATH 里找 —— 于是编译用的解释器由 runner 的
      # 系统 python 决定，跟 .python-version 无关。
      #
      # 这在 ubuntu-latest 上一直没暴露（系统 python 恰好是 3.12，在 pyo3
      # 0.22 支持范围内）；迁到 self-hosted 立刻炸：
      #   error: the configured Python interpreter version (3.14) is newer
      #          than PyO3's maximum supported version (3.13)
      # gpupc 的系统 python 是 3.14。同一份代码换台机器就编不过，正是
      # "版本声明必须单一来源" 要消灭的那类问题。
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version-file: .python-version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nous-core

      - name: Check compilation
        env:
          # 显式钉死，不靠 PATH 顺序 —— setup-python 装的解释器未必排在
          # 系统 python 前面，而 pyo3 只认它找到的第一个。
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: cargo check

      - name: Clippy lint
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: cargo clippy -- -D warnings
