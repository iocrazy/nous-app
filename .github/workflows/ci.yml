# CI - Pull Request Quality Checks
# Runs on every PR to master: frontend build, backend lint, browser tests,
# Rust check, codex-daemon tests.
#
# 五个测试 job 都挂在 `changes` job 后面，按「这个 PR 碰了哪些目录」决定跑不跑
# （scripts/ci-changed-areas.sh，映射表与三条不变量写在脚本头部）。托管 runner
# 按 job 并行数计费，五个 job 全跑一次 = 22–44 计费分钟，而 2026-09-09 实测最近
# 60 个 PR 里 63% 只碰一个区域或纯文档。
#
# ⚠️ 兜底方向永远是「多跑」：changes job 挂了、输出缺失、路径不在映射表内，
# 五个 job 一律照跑。每个 job 的 `if:` 因此写的是 `!= 'false'` 而不是 `== 'true'`，
# 且带 `!cancelled()` 让 needs 失败时仍然执行 —— 改这两处之前先读脚本头注释。

name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    # 仓库默认 workflow token 是只读的（default_workflow_permissions: read），
    # 而那个"只读"**不含** pull-requests —— 读 pulls/{n}/files 会 403。只在
    # 此 job 提权，且只到 read（同 pr-behind-check 的做法，不动全局默认）。
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.areas.outputs.frontend }}
      backend: ${{ steps.areas.outputs.backend }}
      browser: ${{ steps.areas.outputs.browser }}
      rust: ${{ steps.areas.outputs.rust }}
      codex_daemon: ${{ steps.areas.outputs.codex_daemon }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 只要 scripts/。文件清单来自 REST（pulls/{n}/files），不依赖 git 历史
          # —— `git diff origin/base...HEAD` 那条路依赖 fetch 深度，正是 backend
          # job 里记的 2026-08-23 lint 门禁静默失效的触发条件。
          sparse-checkout: scripts

      # 先自测：一个恒真的门禁比没有门禁更糟。自测覆盖两向 —— 该跳的跳、
      # 该跑的跑，以及脚本自己拿不到清单时**只许**退化成全跑。
      - name: Self-test the gate before trusting it
        run: bash scripts/ci-changed-areas.selftest.sh

      - name: Compute changed areas
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/ci-changed-areas.sh

  frontend:
    name: Frontend Build
    # fork PR 一律跳过。守卫留着不删：仓库现在是 private，外部 fork PR 本就
    # 不会发生，删掉换不回任何东西；而万一将来再迁回 self-hosted，少这一行
    # 就等于把生产部署机交给任何人。
    needs: changes
    # 三段：① !cancelled() —— changes job 挂了也要跑，兜底方向是"多跑"；
    # ② fork 守卫；③ changes 没有**明确**说 false 就跑（输出缺失 = 也跑）。
    if: >-
      ${{ !cancelled()
          && github.event.pull_request.head.repo.full_name == github.repository
          && needs.changes.outputs.frontend != 'false' }}
    # 2026-09-07 迁回 ubuntu-latest。2026-08-06 迁去 self-hosted 的理由已失效，
    # 而代价在累积：
    #  · 计费假红（runner_name 为空 + steps=0 + 2 秒 fail）已恢复 —— 同日
    #    lint-workflows / deploy-pages / schema-drift 在托管 runner 上都拿到
    #    真实 runner 并跑绿。
    #  · 单 runner 让五个 job 串行且与 deploy-gpu 争用，2026-09-06 两次 PR
    #    分别排队 3h26m / 3h30m。
    #  · gpupc 走 5G 计费网络，每个 job 的 checkout + 装依赖都在烧流量。
    #  · CI 构建（48 核跑满 + buildkit 打 IO）与生产 Postgres 同盘会拖慢后者，
    #    而没有任何探针会告诉你 —— 与「探针必须探真信号」同族。
    #
    # ⚠️ 若要再迁回 self-hosted：**五处** runs-on 都要改（旧注释写"三处"是错的，
    # rust 与 codex-daemon 是后加的），并把下面各处的云端缓存重新关掉。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 读 .nvmrc，不写死。曾是 CI 验 node 20 而 deploy-pages 用 22 构建
          # 出货产物 —— 门禁跑的和线上跑的不是同一个 major，验过的等于没验。
          # 仓库此前既无 .nvmrc 也无 package.json engines，无处对齐。
          node-version-file: .nvmrc
          # 托管 runner 每次新建，~/.npm 不跨 job 持久，所以云端缓存是净收益。
          # 2026-09-06 在 self-hosted 上关过它（那台机器本地已有缓存，走 5G
          # 上行做云端往返每 job 白烧约 0.36 GB）—— 迁回托管后该理由不成立。
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Hooks gate: rules-of-hooks violations shipped to prod before (#1094,
      # early-return-then-useState = React #310). Blocking on error; the
      # exhaustive-deps rule reports as warning only.
      - name: ESLint (react-hooks gate)
        run: npm run lint

      # Non-blocking: surfaces pre-existing type errors in PR output without
      # breaking CI. Flip to a required step once the backlog is cleared.
      - name: TypeScript check
        run: npm run typecheck
        continue-on-error: true

      - name: No zinc utilities (ink migration guard)
        run: bash scripts/check-no-zinc.sh

      - name: Build (includes TypeScript check)
        run: npm run build

      # Phase S (S1) + P1 fix: vitest is now BLOCKING. 52/52 tests pass
      # locally as of this commit; failures must be addressed not ignored.
      - name: Vitest unit tests
        run: npx vitest run --reporter=default

  backend:
    name: Backend Lint & Deps
    # 同 frontend job：fork 守卫 + self-hosted 的理由见那里的注释
    needs: changes
    # 三段：① !cancelled() —— changes job 挂了也要跑，兜底方向是"多跑"；
    # ② fork 守卫；③ changes 没有**明确**说 false 就跑（输出缺失 = 也跑）。
    if: >-
      ${{ !cancelled()
          && github.event.pull_request.head.repo.full_name == github.repository
          && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so the diff against the PR base branch
          # can find the merge-base. Without this we can't compute
          # the changed-files set and the lint scope falls back to
          # everything (or fails to find origin/<base>).
          fetch-depth: 0

      # migration 取号查重。放在 backend job 而不是新开 workflow：这个 job
      # 已经有 fork 守卫 + self-hosted + checkout，而只有一个 runner，多一个
      # job 就是多一次串行 checkout。放在 setup-uv 之前，几百毫秒就出结果，
      # 不用等装依赖。
      #
      # ⚠️ 脚本内部会自己 `git fetch origin <base>` 拿 CI 运行这一刻的 master，
      # 不看 merge-base —— 理由写在脚本头部，那正是 2026-08-09 连撞两次的窗口。
      - name: Migration number collision check
        working-directory: ${{ github.workspace }}
        run: bash scripts/check-migration-numbers.sh pr "${{ github.base_ref }}"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          # 托管 runner 上没有任何跨 job 持久的本地目录，所以必须开云端缓存，
          # 否则每轮从 PyPI 重下几百 MB —— 2026-08-07 曾因此连挂三轮
          # （virtualenv / dbos / posthog 各卡一次）。
          # 2026-09-06 在 self-hosted 上关过它（本地已有缓存，云端往返在 5G
          # 计费网络上是纯浪费）—— 迁回托管后该理由不成立。
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          # 读 .python-version，不写死版本号。写死过 "3.12"，而 .python-version
          # 是 3.13、Dockerfile 也 pin 在 python:3.13-slim —— CI 于是在一个生产
          # 从不使用的解释器上做 lint 和依赖解析，绿了却什么也没保证。
          # requires-python = ">=3.12" 是下限不是锁，拦不住这种漂移。
          # 路径相对 workspace 根：defaults.working-directory 只作用于 run 步骤。
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen

      # Lint scope: only Python files this PR added / modified / renamed
      # under backend/. Computed from the merge-base diff with the PR
      # base branch — running the full-tree lint on every PR is unfair
      # when master carries pre-existing format debt (any PR would be
      # red through no fault of its author).
      - name: Compute changed Python files
        id: changed
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # ⚠️ NO --depth=1 here. The checkout above sets fetch-depth: 0
          # precisely so the merge-base exists; re-fetching the base ref
          # shallow UNDOES that and truncates origin/<base> to its tip.
          # The three-dot diff below then dies with "no merge base", and —
          # before this was fixed — the `|| true` swallowed it into an empty
          # CHANGED, so black/isort/flake8 all SKIPPED and the job still
          # reported green.
          #
          # It failed nondeterministically, which is worse than always: while
          # a PR sits exactly on the base tip the merge-base IS that tip, so
          # depth=1 contains it and the gate works. The moment master moves
          # ahead the gate silently stops checking — i.e. it switches itself
          # off exactly when the branch is drifting and you need it most.
          # (Measured 2026-08-23 on PR #1973: lint ran and caught a black
          # violation; two master commits later the same job skipped all
          # three linters.)
          git fetch origin "${{ github.base_ref }}"
          # --diff-filter=AMR: Added, Modified, Renamed (skip Deleted —
          # nothing to lint on a removed file).
          # Pathspec scopes to backend/ then we filter .py via grep —
          # the `**/*.py` pathspec form skips files at depth 1 (e.g.
          # tests/foo.py directly under tests/), which is wrong.
          #
          # `git diff` gets its own `if` rather than `|| true`: "the diff
          # failed" and "nothing changed" must not collapse into one empty
          # string. An unlintable PR has to be loud, not green.
          if ! RAW=$(git diff --name-only --diff-filter=AMR \
            "origin/${{ github.base_ref }}...HEAD" \
            -- 'backend/app/**' 'backend/tests/**'); then
            echo "::error::Could not diff against origin/${{ github.base_ref }} — the changed-file set is unknown, so the lint gate cannot run."
            exit 1
          fi
          CHANGED=$(echo "$RAW" | grep -E '\.py$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No backend Python files changed in this PR."
            echo "files=" >> "$GITHUB_OUTPUT"
          else
            # Strip backend/ prefix so the paths work in subsequent
            # steps that run with working-directory: backend.
            RELATIVE=$(echo "$CHANGED" | sed 's|^backend/||' | tr '\n' ' ')
            echo "files=$RELATIVE" >> "$GITHUB_OUTPUT"
            echo "Changed files: $RELATIVE"
          fi

      - name: Check code formatting (black)
        if: steps.changed.outputs.files != ''
        run: uv run black --check ${{ steps.changed.outputs.files }}

      - name: Check import ordering (isort)
        if: steps.changed.outputs.files != ''
        run: uv run isort --check-only ${{ steps.changed.outputs.files }}

      - name: Lint (flake8)
        if: steps.changed.outputs.files != ''
        run: uv run flake8 ${{ steps.changed.outputs.files }}

      - name: Run tests (pytest)
        env:
          # Dummy values so `get_async_supabase_admin()` guard passes at import.
          # Actual Supabase calls are patched at the test layer; the admin
          # client init itself just needs URL+key to be non-empty.
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: dummy_service_role_key_for_ci
          SUPABASE_ANON_KEY: dummy_anon_key_for_ci
        run: uv run pytest tests/ -v --tb=short

  browser:
    name: Browser Sidecar Tests
    # 同 frontend job：fork 守卫 + self-hosted 的理由见那里的注释
    needs: changes
    # 三段：① !cancelled() —— changes job 挂了也要跑，兜底方向是"多跑"；
    # ② fork 守卫；③ changes 没有**明确**说 false 就跑（输出缺失 = 也跑）。
    if: >-
      ${{ !cancelled()
          && github.event.pull_request.head.repo.full_name == github.repository
          && needs.changes.outputs.browser != 'false' }}
    runs-on: ubuntu-latest
    # 在此之前 `browser/` 的 600 个用例**全仓没有任何 workflow 跑过** ——
    # ci.yml 的 pytest 步骤 working-directory 是 backend、只跑 backend/tests/，
    # 于是纯 browser 改动的 PR 绿灯不代表那套测试跑过一次。
    #
    # ⚠️ 为什么是独立 job 而不是并进 backend job 加一个 step。
    # 单 runner 串行，多一个 job 确实多一次 checkout —— 但这里必须拆，
    # 决定性的理由是**解释器版本冲突**：backend 要 3.13，browser 要 3.12
    # （见下面 python-version-file 那段）。同一个 job 里 setup-python 跑两次，
    # 谁在 PATH 前面由 step 顺序决定，而 uv / pytest 只认它找到的第一个 ——
    # 这正是下面 rust job 注释里 pyo3 那个 bug 的同一类问题，不该再造一次。
    # 次要理由：working-directory 与 uv sync 参数都不同（--extra dev 而非
    # --dev，理由见 browser/pyproject.toml），以及红灯归因 —— browser 测试挂了
    # 该显示 "Browser Sidecar Tests" 失败，而不是让人去 "Backend Lint & Deps"
    # 里翻日志。代价：一次额外 checkout（fetch-depth 默认 1，秒级），相对
    # uv sync + 30s 测试可以忽略。
    #
    # 2026-09-09 起按区域跑（见文件头与 scripts/ci-changed-areas.sh）。此前
    # 刻意不加过滤，担心的是"skipped 与 pending 会变成新的坑"—— 查过了：job 级
    # `if:` 跳过的 job 对 required check 记作通过，会永远 pending 的是
    # on.pull_request.paths 让 workflow 整个不触发那种，我们没用那种。
    # "browser/** 改动必触发"这条底线由自测钉住。
    defaults:
      run:
        working-directory: browser

    steps:
      - uses: actions/checkout@v4

      # ⚠️ 与 rust job 同一条纪律：别往 runner 用户的 home 里写东西。
      # runner 以 heygo 跑在 gpupc 上，那个 home 是活人在用的开发环境。
      #
      # 这里不是理论风险：解释器不满足约束时 uv 会**下载一个 managed
      # python**，默认落点就是 ~/.local/share/uv/python/（本机实测那里已经
      # 躺着 cpython-3.12 和 3.13 两份）。UV_PYTHON_INSTALL_DIR 把它导到
      # runner 的 tool cache —— self-hosted 上跨 job 持久（省掉重复下载），
      # 托管 runner 上是 /opt/hostedtoolcache、每次新建，所以这样写切回
      # ubuntu-latest 也不会坏。
      - name: Keep uv-managed interpreters out of the runner user's home
        run: echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TOOL_CACHE/uv-python" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          # 理由同 backend job 的同名配置。uv 缓存按包内容寻址，两个 job
          # 共用同一份不会串味。
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          # 读 browser/.python-version（3.12），**不是**仓库根那份 3.13。
          #
          # browser 的解释器版本由上游决定：基础镜像
          # mcr.microsoft.com/playwright/python:v1.52.0-noble 自带 3.12.3。
          # 而 pyproject.toml 的 requires-python = ">=3.12" 是**下限不是锁** ——
          # 实测在没有 .python-version 时 `uv run python -V` 解析到 3.13.14，
          # 也就是说门禁会在一个生产从不使用的解释器上把 600 个用例跑绿，
          # 与 2026-08-06 "CI 验 3.12 而生产是 3.13" 是同一族问题。
          # 新增那个文件就是为了消掉它，同时给 uv 和 setup-python 一个共同来源。
          # 路径相对 workspace 根：defaults.working-directory 只作用于 run 步骤。
          python-version-file: browser/.python-version

      - name: Install dependencies
        # --extra dev，不是 --dev：测试依赖挂在 optional-dependencies 下，这是
        # 刻意的，好让生产镜像那层裸 uv sync 不装 pytest/httpx。理由与代价见
        # browser/pyproject.toml 第 29-36 行，别"统一"成 dependency-groups。
        run: uv sync --frozen --extra dev

      # 探针必须可证伪：只 echo 版本号，漂回 3.13 时日志里有证据却没人看，
      # 等于没探。所以这里直接断言，不符就红。
      - name: Verify the interpreter is the 3.12 series (matches the prod image)
        run: |
          uv run python -VV
          ACTUAL=$(uv run python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "resolved python: $ACTUAL (expected 3.12, per browser/.python-version)"
          if [ "$ACTUAL" != "3.12" ]; then
            echo "::error::browser tests resolved to Python $ACTUAL, but the prod image (playwright:v1.52.0-noble) ships 3.12. Green here would prove nothing about prod."
            exit 1
          fi

      # 全量跑 browser/tests/。那 10 个 integration 用例自带
      # skipif(not _chromium_available())，在没有 Chromium 的 runner 上自动
      # skip —— 所以这里**不装** playwright 浏览器（一次几百 MB，而真浏览器
      # 行为的守卫在 deploy-gpu 的 smoke 那层，不在 PR 门禁）。
      # 期望结果：557 passed, 10 skipped。
      - name: Run tests (pytest)
        run: uv run pytest tests/ -v --tb=short

  rust:
    name: Rust Check
    # 同 frontend job：fork 守卫 + self-hosted 的理由见那里的注释
    needs: changes
    # 三段：① !cancelled() —— changes job 挂了也要跑，兜底方向是"多跑"；
    # ② fork 守卫；③ changes 没有**明确**说 false 就跑（输出缺失 = 也跑）。
    if: >-
      ${{ !cancelled()
          && github.event.pull_request.head.repo.full_name == github.repository
          && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    # ⚠️ 把 rust 工具链关进 runner 的 tool cache，别碰 runner 用户的 home。
    #
    # 迁到 self-hosted 后第一次跑 rust job，就把开发者的 ~/.cargo/bin/rustup
    # 二进制弄没了 —— 那目录下 cargo / cargo-clippy 都是指向 rustup 的符号
    # 链接，rustup 一丢，本机 `cargo` 直接 command not found（~/.rustup/
    # toolchains 里的实体反而完好）。托管 runner 上这类破坏无所谓，机器用完
    # 就销毁；self-hosted 的 home 是活人在用的。
    #
    # 具体做法见下面第一个 step —— 注意不能写成 job 级 `env:` 配
    # ${{ runner.tool_cache }}：runner context 在 job 级 env 里不可用
    # （那里只认 github/inputs/matrix/needs/secrets/strategy/vars），
    # actionlint 会直接拒绝。
    defaults:
      run:
        working-directory: nous-core

    steps:
      - uses: actions/checkout@v4

      # $RUNNER_TOOL_CACHE 是 runner 自动导出的环境变量，写进 $GITHUB_ENV 后
      # 对后续所有 step 生效。
      #
      # 只在 self-hosted 上重定向。托管 runner 用完即销毁，没有"活人的 home"
      # 要保护；反过来把 RUSTUP_HOME 指向空目录会让 dtolnay/rust-toolchain
      # 放弃预装工具链、每轮重下几百 MB，在计费分钟数上是净亏。
      # Swatinem/rust-cache 读 CARGO_HOME（源码 config.ts:
      # `process.env.CARGO_HOME || path.join(HOME, ".cargo")`），两种情形下
      # 都能找到正确目录，所以这个条件不会让缓存失效。
      - name: Keep the rust toolchain out of the runner user's home
        if: runner.environment == 'self-hosted'
        run: |
          echo "CARGO_HOME=$RUNNER_TOOL_CACHE/rust/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TOOL_CACHE/rust/rustup" >> "$GITHUB_ENV"

      # nous-core 是 pyo3 扩展，编译时要链接一个具体的 CPython。不指定的话
      # pyo3 的 build script 去 PATH 里找 —— 于是编译用的解释器由 runner 的
      # 系统 python 决定，跟 .python-version 无关。
      #
      # 这在 ubuntu-latest 上一直没暴露（系统 python 恰好是 3.12，在 pyo3
      # 0.22 支持范围内）；迁到 self-hosted 立刻炸：
      #   error: the configured Python interpreter version (3.14) is newer
      #          than PyO3's maximum supported version (3.13)
      # gpupc 的系统 python 是 3.14。同一份代码换台机器就编不过，正是
      # "版本声明必须单一来源" 要消灭的那类问题。
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version-file: .python-version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # 托管 runner 上 target/ 与 ~/.cargo 都不跨 job 持久，而 nous-core 是
      # pyo3 扩展、冷编译要好几分钟，所以云端缓存是净收益。2026-09-06 在
      # self-hosted 上移除过它（那两个目录本来就留在本地磁盘，云端往返在 5G
      # 计费网络上纯属浪费）—— 迁回托管后该理由不成立。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nous-core

      - name: Check compilation
        env:
          # 显式钉死，不靠 PATH 顺序 —— setup-python 装的解释器未必排在
          # 系统 python 前面，而 pyo3 只认它找到的第一个。
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: cargo check

      - name: Clippy lint
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: cargo clippy -- -D warnings

  codex-daemon:
    name: Codex Daemon Tests
    # fork PR 一律跳过 —— 同 frontend job 的理由。本 job 现在跑托管 runner，
    # 守卫留着是为了迁回 self-hosted 时不用重加（那时漏掉这一行，等于把生产
    # 部署机交给任何人）。
    needs: changes
    # 三段：① !cancelled() —— changes job 挂了也要跑，兜底方向是"多跑"；
    # ② fork 守卫；③ changes 没有**明确**说 false 就跑（输出缺失 = 也跑）。
    if: >-
      ${{ !cancelled()
          && github.event.pull_request.head.repo.full_name == github.repository
          && needs.changes.outputs.codex_daemon != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/codex-daemon

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 读 .nvmrc，不写死版本号（同 frontend job）。⚠️ 路径相对 workspace
          # 根，defaults.run.working-directory 不影响 action 输入。
          node-version-file: .nvmrc
          # 不配 cache：这个包零依赖、没有 lockfile，setup-node 的 npm cache
          # 会因为找不到 package-lock.json 直接失败。

      # 没有 npm ci —— 零依赖，node --test 是内置的。整个 job 跑不到一秒。
      #
      # 2026-09-09 起按区域跑（见文件头）。此前这里写"用改了哪些文件决定跑不跑
      # 是门禁静默跳过的经典成因"—— 那条教训针对的是 job 内部 `git diff` 失败
      # 被 `|| true` 吞成空列表；现在的做法清单来自 REST、失败一律退化成全跑，
      # 并有自测钉住这个方向。这个 job 本身不到一秒，跳不跳都无所谓，跟着走
      # 只是为了五个 job 一个约定。
      - name: Unit tests (node --test)
        run: npm test
