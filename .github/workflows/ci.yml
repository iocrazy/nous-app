# CI - Pull Request Quality Checks
# Runs on every PR to master: frontend build, backend lint, Rust check

name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Non-blocking: surfaces pre-existing type errors in PR output without
      # breaking CI. Flip to a required step once the backlog is cleared.
      - name: TypeScript check
        run: npm run typecheck
        continue-on-error: true

      - name: Build (includes TypeScript check)
        run: npm run build

      # Phase S (S1) + P1 fix: vitest is now BLOCKING. 52/52 tests pass
      # locally as of this commit; failures must be addressed not ignored.
      - name: Vitest unit tests
        run: npx vitest run --reporter=default

  backend:
    name: Backend Lint & Deps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so the diff against the PR base branch
          # can find the merge-base. Without this we can't compute
          # the changed-files set and the lint scope falls back to
          # everything (or fails to find origin/<base>).
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # Lint scope: only Python files this PR added / modified / renamed
      # under backend/. Computed from the merge-base diff with the PR
      # base branch — running the full-tree lint on every PR is unfair
      # when master carries pre-existing format debt (any PR would be
      # red through no fault of its author).
      - name: Compute changed Python files
        id: changed
        working-directory: ${{ github.workspace }}
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true
          # --diff-filter=AMR: Added, Modified, Renamed (skip Deleted —
          # nothing to lint on a removed file).
          # Pathspec scopes to backend/ then we filter .py via grep —
          # the `**/*.py` pathspec form skips files at depth 1 (e.g.
          # tests/foo.py directly under tests/), which is wrong.
          CHANGED=$(git diff --name-only --diff-filter=AMR \
            "origin/${{ github.base_ref }}...HEAD" \
            -- 'backend/app/**' 'backend/tests/**' \
            | grep -E '\.py$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No backend Python files changed in this PR."
            echo "files=" >> "$GITHUB_OUTPUT"
          else
            # Strip backend/ prefix so the paths work in subsequent
            # steps that run with working-directory: backend.
            RELATIVE=$(echo "$CHANGED" | sed 's|^backend/||' | tr '\n' ' ')
            echo "files=$RELATIVE" >> "$GITHUB_OUTPUT"
            echo "Changed files: $RELATIVE"
          fi

      - name: Check code formatting (black)
        if: steps.changed.outputs.files != ''
        run: uv run black --check ${{ steps.changed.outputs.files }}

      - name: Check import ordering (isort)
        if: steps.changed.outputs.files != ''
        run: uv run isort --check-only ${{ steps.changed.outputs.files }}

      - name: Lint (flake8)
        if: steps.changed.outputs.files != ''
        run: uv run flake8 ${{ steps.changed.outputs.files }}

      - name: Run tests (pytest)
        env:
          # Dummy values so `get_async_supabase_admin()` guard passes at import.
          # Actual Supabase calls are patched at the test layer; the admin
          # client init itself just needs URL+key to be non-empty.
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: dummy_service_role_key_for_ci
          SUPABASE_ANON_KEY: dummy_anon_key_for_ci
        run: uv run pytest tests/ -v --tb=short

  rust:
    name: Rust Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mediahub-core

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mediahub-core

      - name: Check compilation
        run: cargo check

      - name: Clippy lint
        run: cargo clippy -- -D warnings
