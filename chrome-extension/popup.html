<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>MediaHub Push</h1>

    <!-- Settings view -->
    <div id="settingsView">
      <div class="field">
        <label for="apiUrl">API URL</label>
        <input type="url" id="apiUrl" placeholder="https://mediahub.heygo.cn">
      </div>
      <div class="field">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="dk_...">
      </div>
      <button id="saveBtn">Save</button>
      <div id="status" class="status"></div>
    </div>

    <!-- Push view (shown when configured) -->
    <div id="pushView" style="display:none;">
      <div class="current-url" id="currentUrl"></div>

      <div class="section-label-row">
        <span class="section-label">Select Tags</span>
        <button id="createTagToggle" class="icon-btn" title="Create tag">+</button>
      </div>

      <!-- Create tag form (hidden by default) -->
      <div id="createTagForm" class="create-tag-form" style="display:none;">
        <input type="text" id="newTagInput" placeholder="Tag name (auto-translate)">
        <div id="translatePreview" class="translate-preview" style="display:none;"></div>
        <select id="newTagGroup">
          <option value="">Select group (optional)</option>
        </select>
        <button id="createTagBtn">Create</button>
        <div id="createTagStatus" class="status"></div>
      </div>

      <div id="tagsLoading" class="tags-loading">Loading tags...</div>
      <div id="tagsContainer" class="tags-container"></div>

      <button id="pushBtn" class="push-btn">Push to MediaHub</button>
      <div class="bottom-row">
        <span id="pushStatus" class="status"></span>
        <button id="settingsToggle" class="link-btn">Settings</button>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
