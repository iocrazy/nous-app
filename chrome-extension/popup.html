<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="app-header">
      <h1>MediaHub Push</h1>
      <span id="appVersion" class="app-version"></span>
    </div>

    <!-- Mode tabs (shown when configured) -->
    <div id="modeTabs" class="mode-tabs" style="display:none;">
      <button id="tabPush" class="mode-tab active" type="button">Push</button>
      <button id="tabScan" class="mode-tab" type="button">Scan Images</button>
    </div>

    <!-- Settings view -->
    <div id="settingsView">
      <div class="field">
        <label for="apiUrl">API URL</label>
        <input type="url" id="apiUrl" placeholder="https://cn.nous.ink:88">
      </div>
      <div class="field">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="dk_...">
      </div>
      <div class="field">
        <label for="webUrl">Web URL</label>
        <input type="url" id="webUrl" placeholder="https://app.nous.ink">
      </div>
      <button id="saveBtn">Save</button>
      <div id="status" class="status"></div>
    </div>

    <!-- Push view (shown when configured) -->
    <div id="pushView" style="display:none;">
      <input type="url" class="current-url" id="currentUrl" placeholder="https://..." spellcheck="false" />

      <div class="section-label-row">
        <span class="section-label">Select Tags</span>
        <button id="createTagToggle" class="icon-btn" title="Create tag">+</button>
      </div>

      <!-- Create tag form (hidden by default) -->
      <div id="createTagForm" class="create-tag-form" style="display:none;">
        <input type="text" id="newTagInput" placeholder="Tag name (auto-translate)">
        <div id="translateWrapper" class="translate-wrapper" style="display:none;">
          <span id="translateLabel" class="translate-label"></span>
          <input type="text" id="translateInput" class="translate-input" placeholder="Translation (editable)">
          <button type="button" id="translateSameBtn" class="translate-same-btn" title="Use same as input (for technical terms like Agent, Skill, LLM)">=</button>
        </div>
        <div class="custom-select" id="newTagGroupWrapper">
          <div class="custom-select-trigger" id="newTagGroupTrigger">Select group (optional)</div>
          <div class="custom-select-options" id="newTagGroupOptions" style="display:none;"></div>
          <input type="hidden" id="newTagGroup" value="">
        </div>
        <button id="createTagBtn">Create</button>
        <div id="createTagStatus" class="status"></div>
      </div>

      <input type="text" id="tagSearch" class="tag-search" placeholder="Search tags..." spellcheck="false" autocomplete="off" />

      <!-- Search-or-create bar. Lives OUTSIDE #tagsContainer on purpose: that
           container is wiped and rebuilt on every keystroke, which would blow
           away this input's value and focus mid-typing. -->
      <div id="quickCreateBar" class="quick-create-bar" style="display:none;">
        <button type="button" id="quickCreateBtn" class="tag-create-affordance"></button>
        <div class="translate-wrapper">
          <span id="quickTranslateLabel" class="translate-label"></span>
          <input type="text" id="quickTranslateInput" class="translate-input" placeholder="Translation (editable)" spellcheck="false" autocomplete="off">
          <button type="button" id="quickTranslateSameBtn" class="translate-same-btn" title="Use same as input (for technical terms like ComfyUI, Lora, LLM)">=</button>
        </div>
        <div id="quickCreateError" class="tag-create-error" style="display:none;"></div>
      </div>

      <div id="tagsLoading" class="tags-loading">Loading tags...</div>
      <div id="tagsContainer" class="tags-container"></div>

      <!-- Processing options. Rating + AI intents replace picking the Pipeline
           tags (Transcript / Summary / Analyze), which the tag list hides.
           Placed right above Push: it is part of the push request, and keeping
           it below the scrolling tag list means it never scrolls out of view.
           The markup is static; popup.js only syncs lit / aria-pressed state. -->
      <div id="pushOptions" class="push-options">
        <!-- Icon sprite: lucide star / file-text / book-open / scan-eye path
             data (same icons as the web picker), drawn with currentColor. -->
        <svg class="icon-sprite" aria-hidden="true" focusable="false">
          <symbol id="icon-star" viewBox="0 0 24 24"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></symbol>
          <symbol id="icon-file-text" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></symbol>
          <symbol id="icon-book-open" viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></symbol>
          <symbol id="icon-scan-eye" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="1"/><path d="M18.944 12.33a1 1 0 0 0 0-.66 7.5 7.5 0 0 0-13.888 0 1 1 0 0 0 0 .66 7.5 7.5 0 0 0 13.888 0"/></symbol>
        </svg>
        <div class="rating-row" role="group" aria-label="Rating">
          <span class="option-label">Rating</span>
          <div class="rating-stars">
            <button type="button" class="star-btn" data-rating="1" aria-label="1 star" aria-pressed="false"><svg aria-hidden="true"><use href="#icon-star"/></svg></button>
            <button type="button" class="star-btn" data-rating="2" aria-label="2 stars" aria-pressed="false"><svg aria-hidden="true"><use href="#icon-star"/></svg></button>
            <button type="button" class="star-btn" data-rating="3" aria-label="3 stars" aria-pressed="false"><svg aria-hidden="true"><use href="#icon-star"/></svg></button>
            <button type="button" class="star-btn" data-rating="4" aria-label="4 stars" aria-pressed="false"><svg aria-hidden="true"><use href="#icon-star"/></svg></button>
            <button type="button" class="star-btn" data-rating="5" aria-label="5 stars" aria-pressed="false"><svg aria-hidden="true"><use href="#icon-star"/></svg></button>
          </div>
        </div>
        <!-- Left to right: Transcribe / Summary / Analyze. Summary or Analyze
             switches Transcribe on too (see intents.js). -->
        <div class="intent-row" role="group" aria-label="AI processing">
          <button type="button" class="intent-btn" data-intent="transcribe" aria-pressed="false"><svg aria-hidden="true"><use href="#icon-file-text"/></svg><span>Transcribe</span></button>
          <button type="button" class="intent-btn" data-intent="summarize" aria-pressed="false"><svg aria-hidden="true"><use href="#icon-book-open"/></svg><span>Summary</span></button>
          <button type="button" class="intent-btn" data-intent="analyze" aria-pressed="false"><svg aria-hidden="true"><use href="#icon-scan-eye"/></svg><span>Analyze</span></button>
        </div>
      </div>

      <button id="pushBtn" class="push-btn">Push to MediaHub</button>
      <div class="bottom-row">
        <span id="pushStatus" class="status"></span>
        <button id="settingsToggle" class="link-btn">Settings</button>
      </div>
    </div>
    <!-- Scan Images view -->
    <div id="scanView" style="display:none;">
      <div class="scan-pickers">
        <div class="field">
          <label for="scopeSelect">Scope</label>
          <select id="scopeSelect" class="scan-select">
            <option value="">Loading...</option>
          </select>
        </div>
        <div class="field">
          <label for="folderSelect">Folder</label>
          <select id="folderSelect" class="scan-select">
            <option value="">Library root</option>
          </select>
        </div>
      </div>

      <button id="scanBtn" type="button">Scan Page Images</button>
      <div id="scanStatus" class="status info"></div>

      <div id="scanToolbar" class="scan-toolbar" style="display:none;">
        <label class="check-label">
          <input type="checkbox" id="selectAllChk">
          <span id="selectInfo">0 selected</span>
        </label>
        <select id="minSizeSelect" class="scan-select scan-select-small">
          <option value="0">Any size</option>
          <option value="200" selected>&ge; 200px</option>
          <option value="500">&ge; 500px</option>
        </select>
      </div>

      <div id="imageGrid" class="image-grid"></div>

      <label class="check-label" id="autoTagRow" style="display:none;">
        <input type="checkbox" id="autoTagChk">
        <span>Auto Tag after import (AI)</span>
      </label>
      <button id="importBtn" type="button" style="display:none;">Import Selected</button>

      <div id="importProgress" class="import-progress" style="display:none;">
        <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
        <div id="importStatus" class="status info"></div>
      </div>
    </div>
  </div>
  <script src="intents.js"></script>
  <script src="popup.js"></script>
  <script src="scan.js"></script>
</body>
</html>
