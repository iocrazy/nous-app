[package]
name = "mediahub-core"
version = "0.1.0"
edition = "2021"
description = "High-performance media processing module for MediaHub (FFmpeg wrapper, HLS segmentation)"

[lib]
name = "mediahub_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
