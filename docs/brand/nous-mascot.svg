<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="nous-title nous-desc">
<title id="nous-title">nous / 無我</title><desc id="nous-desc">Editable vector interpretation of the approved mascot. No embedded raster images.</desc>
<defs>
  <linearGradient id="ear-left" x1="76" y1="477" x2="320" y2="258" gradientUnits="userSpaceOnUse">
    <stop stop-color="#78d2ec"/><stop offset=".4" stop-color="#9eb9f5"/>
    <stop offset=".72" stop-color="#d0baf5"/><stop offset="1" stop-color="#f8e7f4"/>
  </linearGradient>
  <linearGradient id="ear-right" x1="704" y1="214" x2="913" y2="505" gradientUnits="userSpaceOnUse">
    <stop stop-color="#e8e6f7"/><stop offset=".45" stop-color="#f0bcd8"/>
    <stop offset=".76" stop-color="#ffbe9c"/><stop offset="1" stop-color="#ffe0a5"/>
  </linearGradient>
  <radialGradient id="shell" cx=".31" cy=".14" r=".94">
    <stop stop-color="#ffffff"/><stop offset=".5" stop-color="#f8f6f6"/>
    <stop offset=".83" stop-color="#e6e2ed"/><stop offset="1" stop-color="#e2d3d4"/>
  </radialGradient>
  <radialGradient id="body" cx=".3" cy=".22" r=".88">
    <stop stop-color="#ffffff"/><stop offset=".6" stop-color="#f6f2f2"/><stop offset="1" stop-color="#d7cddc"/>
  </radialGradient>
  <linearGradient id="rim" x1=".1" y1="0" x2=".9" y2="1">
    <stop stop-color="#e8e1e5"/><stop offset=".55" stop-color="#fdf8f6"/><stop offset="1" stop-color="#d8d1df"/>
  </linearGradient>
  <radialGradient id="visor" cx=".35" cy=".17" r=".91">
    <stop stop-color="#403747"/><stop offset=".3" stop-color="#201d2a"/>
    <stop offset=".75" stop-color="#121320"/><stop offset="1" stop-color="#252031"/>
  </radialGradient>
  <linearGradient id="hand" x1="0" y1="0" x2=".7" y2="1">
    <stop stop-color="#b8a9b2"/><stop offset=".5" stop-color="#82778b"/><stop offset="1" stop-color="#514858"/>
  </linearGradient>
  <linearGradient id="core" x1="414" y1="512" x2="525" y2="540" gradientUnits="userSpaceOnUse">
    <stop stop-color="#df8de9"/><stop offset=".45" stop-color="#bc8eef"/><stop offset="1" stop-color="#78cbed"/>
  </linearGradient>
  <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#ffffff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
</defs><g id="mascot" transform="translate(0 98)">
