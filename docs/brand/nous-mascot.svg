  <path d="M228 525 Q251 537 278 528" fill="none" stroke="#fff4df" stroke-opacity=".25" stroke-width="4" stroke-linecap="round"/>
  <path id="arm-right" d="M552 457 C579 470 603 487 625 505 C644 500 664 504 675 523
    C686 549 670 572 644 575 C614 578 593 552 575 535Z" fill="url(#body)"/>
  <path id="hand-right" d="M658 520 C670 514 685 508 690 502 C697 496 702 502 697 509
    L688 520 C702 521 710 517 716 517 C721 514 725 519 721 527
    C716 541 697 551 679 551 C666 551 658 538 658 520Z" fill="url(#hand)"/>
  <path d="M716 525 Q693 537 666 528" fill="none" stroke="#fff4df" stroke-opacity=".25" stroke-width="4" stroke-linecap="round"/>
  <!-- Seated, floating pose. -->
  <path id="leg-left" d="M393 600 C359 571 325 570 307 593 C282 623 295 664 323 681
    C349 697 390 701 422 690 L446 662 C433 638 414 618 393 600Z"
