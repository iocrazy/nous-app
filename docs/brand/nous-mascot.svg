    C30 447 64 497 109 507 C181 527 234 482 271 426 C313 364 334 258 317 194Z"
    fill="url(#ear-left)"/>
  <path d="M78 399 C129 371 166 372 211 322 C167 393 142 417 87 420Z" fill="#fff" opacity=".17"/>
  <path id="ribbon-right" d="M650 190 C708 180 748 244 790 292 C845 355 898 361 926 402
    C956 447 926 504 875 513 C801 531 749 486 718 426 C686 363 657 274 650 190Z"
    fill="url(#ear-right)"/>
  <!-- Small body and open hands; head overlaps neck, not the reverse. -->
  <path id="torso" d="M390 440 C367 471 351 524 355 573 C355 624 402 671 472 681
    C541 673 596 630 595 574 C594 522 573 474 553 443Z"
    fill="url(#body)" stroke="#d9d1df" stroke-opacity=".32" stroke-width="2"/>
  <path id="arm-left" d="M391 457 C365 469 340 487 319 505 C300 500 280 504 269 523
    C258 549 274 572 300 575 C330 578 351 552 369 535Z" fill="url(#body)"/>
  <path id="hand-left" d="M286 520 C274 514 259 508 254 502 C247 496 242 502 247 509
