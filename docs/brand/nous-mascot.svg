  <path id="leg-right" d="M551 600 C585 571 619 570 637 593 C662 623 649 664 621 681
    C595 697 554 701 522 690 L498 662 C511 638 530 618 551 600Z"
    fill="url(#body)" stroke="#ddd4e0" stroke-opacity=".4" stroke-width="2"/>
  <path id="foot-left" d="M415 656 C433 645 454 653 466 671 C480 689 468 705 449 705
    C430 704 413 696 410 682 C408 673 410 663 415 656Z" fill="url(#hand)"/>
  <path id="foot-right" d="M529 656 C511 645 490 653 478 671 C464 689 476 705 495 705
    C514 704 531 696 534 682 C536 673 534 663 529 656Z" fill="url(#hand)"/>
  <!-- Infinity: a genuine crossing curve, not a heart-shaped outline. -->
  <path id="core-glow" d="M468 526 C451 505 445 503 435 503 C406 503 406 549 435 549
    C456 549 479 503 499 503 C529 503 529 549 499 549 C488 549 481 542 468 526"
    fill="none" stroke="#dec4f3" stroke-opacity=".35" stroke-width="21" stroke-linecap="round"/>
  <path id="infinity" d="M468 526 C451 505 445 503 435 503 C406 503 406 549 435 549
    C456 549 479 503 499 503 C529 503 529 549 499 549 C488 549 481 542 468 526"
    fill="none" stroke="url(#core)" stroke-width="13" stroke-linecap="round"/>
  <path d="M481 511 L456 541" stroke="#fdf2ff" stroke-width="4" opacity=".42"/>
  <!-- The shell and its visor form the recognizable silhouette. -->
  <path id="head" d="M474 99 C380 96 309 130 272 197 C247 242 249 289 255 347
    C259 413 280 447 326 459 C375 472 579 474 629 460 C676 448 702 421 707 372
    C713 317 703 239 677 193 C640 128 567 97 474 99Z"
    fill="url(#shell)" stroke="#e9e2ef" stroke-width="2"/>
  <path d="M302 228 C334 155 412 125 497 128" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="8" stroke-linecap="round"/>
  <path id="visor-rim" d="M473 154 C389 155 325 194 305 260 C285 326 299 375 330 395
    C374 423 564 424 603 396 C638 372 651 335 637 274 C622 205 563 153 473 154Z"
    fill="url(#rim)"/>
  <path id="face" d="M473 163 C393 164 335 201 314 264 C296 322 307 367 336 386
    C376 411 559 413 597 387 C628 366 640 332 627 277 C613 212 558 162 473 163Z"
    fill="url(#visor)" stroke="#1f1b27" stroke-width="3"/>
  <path d="M333 267 C350 212 402 183 454 180 C411 197 371 232 353 282Z"
    fill="url(#reflection)"/>
  <path d="M573 191 C604 216 619 246 623 275 C605 254 592 247 578 241Z" fill="#989bff" opacity=".075"/>
  <!-- A calm expression. Layered strokes imply glow without raster filters. -->
  <g id="eyes" fill="none" stroke-linecap="round">
    <path d="M365 298 C379 323 410 323 426 300 M493 300 C508 324 539 324 553 299"
      stroke="#a681ef" stroke-width="25" opacity=".12"/>
    <path d="M365 298 C379 323 410 323 426 300 M493 300 C508 324 539 324 553 299"
      stroke="#ba9aff" stroke-width="15" opacity=".34"/>
    <path d="M365 298 C379 323 410 323 426 300 M493 300 C508 324 539 324 553 299"
      stroke="#eee0ff" stroke-width="8"/>
  </g>
</g>
</svg>