version: '3.8'

# MediaHub Docker Compose Configuration
# Usage: cd docker && docker-compose up -d
# Image: crpi-eat03wohif79y6f2.cn-shanghai.personal.cr.aliyuncs.com/heygo/mediahub-backend:latest

services:
  # Redis - Message queue and result storage
  redis:
    image: redis:7-alpine
    container_name: mediahub-app-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MediaHub Main Service (FastAPI)
  mediahub:
    image: crpi-eat03wohif79y6f2.cn-shanghai.personal.cr.aliyuncs.com/heygo/mediahub-backend:latest
    container_name: mediahub-app-backend
    restart: unless-stopped
    # R2: Use docker-init (tini) as PID 1 so signals (SIGTERM from
    # `docker stop`) are forwarded to uvicorn instead of being absorbed
    # by Python; tini also reaps zombie children of crashed subprocs.
    # Pairs with backend's PR_SET_PDEATHSIG safe_popen_kwargs() to
    # eliminate orphans across SIGKILL / OOM.
    init: true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ${DOWNLOAD_HOST_PATH:-/volume2/sources/MediaHub.library}:/app/downloads
      - ./.env:/app/.env
      - ./config/config.yml:/app/config.yml
    environment:
      - TZ=Asia/Shanghai
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DOUBAO_API_KEY=${DOUBAO_API_KEY:-}
      - WHISPER_PROVIDER=${WHISPER_PROVIDER:-openai_api}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # P5: use deep health probe so downstream HEALTHY status reflects
      # subsystem state (DBOS / Supabase / Redis), not just FastAPI alive.
      # If the JSON aggregate status is 'unhealthy' the curl returns
      # a 200 with JSON body status=unhealthy — we grep for it. If we
      # need stricter (HTTP-status-based), back-end can return 503 on
      # 'unhealthy'; for now we keep the response 200 + content check
      # because Prometheus scrape consumers prefer that shape.
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v1/health/deep | grep -q '\"status\":\"healthy\"' || curl -fs http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PR-D7 phase 3b: celery-worker + celery-beat removed. All workflows
  # now run inside the `mediahub` container via DBOS (durable PG-backed
  # queues + @DBOS.scheduled cron). Redis is kept for live download
  # progress tracking + UnifiedProgressTracker key-value state.
  #
  # ── Sprint 5 (D10-A) Gateway/Worker physical split (OPT-IN) ──
  # Default: `mediahub` runs MEDIAHUB_ROLE=combined (HTTP API + DBOS
  # workers in one process). To split: set MEDIAHUB_ROLE=gateway on the
  # `mediahub` service AND uncomment the `mediahub-worker` block below.
  # Both containers share the same DBOS PG queue, so dispatch/consumption
  # is transparent to callers.
  #
  # mediahub-worker:
  #   image: crpi-eat03wohif79y6f2.cn-shanghai.personal.cr.aliyuncs.com/heygo/mediahub-backend:latest
  #   container_name: mediahub-app-worker
  #   restart: unless-stopped
  #   init: true   # R2: tini PID 1 for signal forwarding + zombie reaping
  #   labels:
  #     - "com.centurylinklabs.watchtower.enable=true"
  #   # No published port — worker only serves /health internally.
  #   volumes:
  #     - ${DOWNLOAD_HOST_PATH:-/volume2/sources/MediaHub.library}:/app/downloads
  #     - ./.env:/app/.env
  #     - ./config/config.yml:/app/config.yml
  #   environment:
  #     - TZ=Asia/Shanghai
  #     - REDIS_URL=redis://redis:6379/0
  #     - MEDIAHUB_ROLE=worker          # ← skip HTTP API mount, run DBOS pool
  #     - OPENAI_API_KEY=${OPENAI_API_KEY:-}
  #     - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
  #     - DOUBAO_API_KEY=${DOUBAO_API_KEY:-}
  #     - WHISPER_PROVIDER=${WHISPER_PROVIDER:-openai_api}
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 60s
  #
  # ── GPU Transcode Support (when GPU transcoding lands) ──
  # The mediahub service above can be augmented with:
  #   runtime: nvidia
  #   environment:
  #     - NVIDIA_VISIBLE_DEVICES=all
  # or for Intel iGPU (QSV / VA-API):
  #   devices:
  #     - /dev/dri:/dev/dri

  # Nginx - HLS streaming server
  nginx:
    image: nginx:alpine
    container_name: mediahub-app-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ${DOWNLOAD_HOST_PATH:-/volume2/sources/MediaHub.library}:/app/downloads:ro
      - ./nginx-hls.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - mediahub

  # MediaHub Admin Panel (ACR + Watchtower auto-update)
  mediahub-admin:
    image: crpi-eat03wohif79y6f2.cn-shanghai.personal.cr.aliyuncs.com/heygo/mediahub-admin:latest
    container_name: mediahub-admin
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "3097:8080"
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      mediahub:
        condition: service_healthy

volumes:
  redis_data:
