version: '3.8'

# MediaHub Docker Compose Configuration
# Usage: cd docker && docker-compose up -d
# Image: imheygo/mediahub:latest

services:
  # Redis - Message queue and result storage
  redis:
    image: redis:7-alpine
    container_name: mediahub-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MediaHub Main Service (FastAPI)
  mediahub:
    image: imheygo/mediahub:latest
    container_name: mediahub
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ${DOWNLOAD_HOST_PATH:-/volume2/sources/MediaHub.library}:/app/downloads
      - ./.env:/app/.env
      - ./config/config.yml:/app/config.yml
      - ${COOKIES_HOST_PATH:-./config/cookies}:/app/cookies:ro
    environment:
      - TZ=Asia/Shanghai
      - COOKIES_DIR=/app/cookies
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DOUBAO_API_KEY=${DOUBAO_API_KEY:-}
      - WHISPER_PROVIDER=${WHISPER_PROVIDER:-openai_api}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Celery Worker - Task executor (downloads, parsing, transcription, analysis)
  celery-worker:
    image: imheygo/mediahub:latest
    container_name: mediahub-celery-worker
    restart: unless-stopped
    command: uv run celery -A app.celery_app worker -l info -c 4 -Q downloads,parsing,transcription,analysis,scheduled,celery
    volumes:
      - ${DOWNLOAD_HOST_PATH:-/volume2/sources/MediaHub.library}:/app/downloads
      - ./.env:/app/.env
      - ./config/config.yml:/app/config.yml
      - ${COOKIES_HOST_PATH:-./config/cookies}:/app/cookies:ro
    environment:
      - TZ=Asia/Shanghai
      - COOKIES_DIR=/app/cookies
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DOUBAO_API_KEY=${DOUBAO_API_KEY:-}
      - WHISPER_PROVIDER=${WHISPER_PROVIDER:-openai_api}
    depends_on:
      redis:
        condition: service_healthy
    # ── GPU Transcode Support (uncomment as needed) ──
    # NVIDIA GPU:
    #   runtime: nvidia
    #   environment:
    #     - NVIDIA_VISIBLE_DEVICES=all
    # Intel iGPU (QSV / VA-API):
    #   devices:
    #     - /dev/dri:/dev/dri

  # Celery Beat - Scheduled task scheduler
  celery-beat:
    image: imheygo/mediahub:latest
    container_name: mediahub-celery-beat
    restart: unless-stopped
    command: uv run celery -A app.celery_app beat -l info
    volumes:
      - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  # Nginx - HLS streaming server
  nginx:
    image: nginx:alpine
    container_name: mediahub-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ${DOWNLOAD_HOST_PATH:-/volume2/sources/MediaHub.library}:/app/downloads:ro
      - ./nginx-hls.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - mediahub

  # Flower - Task monitoring Web UI
  flower:
    image: mher/flower:2.0
    container_name: mediahub-flower
    restart: unless-stopped
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_PORT=5555
      - FLOWER_BASIC_AUTH=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    depends_on:
      redis:
        condition: service_healthy

  # MediaHub Admin Panel (local build on NAS)
  mediahub-admin:
    build:
      context: ../admin
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    image: mediahub-admin:local
    container_name: mediahub-admin
    restart: unless-stopped
    ports:
      - "3097:80"
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      mediahub:
        condition: service_healthy

volumes:
  redis_data:
