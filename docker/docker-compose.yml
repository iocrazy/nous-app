version: '3.8'

# MediaHub Docker Compose Configuration
# Usage: cd docker && docker-compose up -d
# Image: crpi-eat03wohif79y6f2.cn-shanghai.personal.cr.aliyuncs.com/heygo/mediahub-backend:latest

services:
  # Redis - Message queue and result storage
  redis:
    image: redis:7-alpine
    container_name: mediahub-app-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MediaHub Main Service (FastAPI)
  mediahub:
    image: crpi-eat03wohif79y6f2.cn-shanghai.personal.cr.aliyuncs.com/heygo/mediahub-backend:latest
    container_name: mediahub-app-backend
    restart: unless-stopped
    # R2: Use docker-init (tini) as PID 1 so signals (SIGTERM from
    # `docker stop`) are forwarded to uvicorn instead of being absorbed
    # by Python; tini also reaps zombie children of crashed subprocs.
    # Pairs with backend's PR_SET_PDEATHSIG safe_popen_kwargs() to
    # eliminate orphans across SIGKILL / OOM.
    init: true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      # Process supervision: autoheal sidecar polls our docker
      # healthcheck status; when this container goes 'unhealthy' for
      # the configured run, autoheal sends SIGKILL → restart policy
      # picks it up. Catches the "process alive but DBOS event-loop
      # wedged" failure mode that restart:unless-stopped misses.
      - "autoheal=true"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ${DOWNLOAD_HOST_PATH:-/volume2/sources/MediaHub.library}:/app/downloads
      - ./.env:/app/.env
      - ./config/config.yml:/app/config.yml
    environment:
      - TZ=Asia/Shanghai
      - REDIS_URL=redis://redis:6379/0
      # PR-D8 Phase 1: gateway/worker physical split. This container
      # serves HTTP only — no DBOS workers, no in-process schedulers.
      # The mediahub-worker container below consumes the DBOS queue.
      # Crashes / OOMs in workflow code now stay isolated to worker
      # pods; HTTP API stays available throughout.
      - MEDIAHUB_ROLE=gateway
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DOUBAO_API_KEY=${DOUBAO_API_KEY:-}
      - WHISPER_PROVIDER=${WHISPER_PROVIDER:-openai_api}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # PR-D8 Phase 1: use the cheap liveness probe (no DB / DBOS deps).
      # Deep probe still available at /api/v1/health/deep for ops; for
      # "is this container alive" we want a millisecond answer that
      # doesn't fail when DBOS is recovering — autoheal would otherwise
      # restart the gateway every time a worker degrades.
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v1/healthz || curl -fs http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── PR-D8 Phase 1: DBOS worker pool (separate process) ──
  # Consumes the agent_workforce queue. No HTTP port published; only
  # /api/v1/healthz + /api/v1/readyz are mounted (worker mode skips
  # the public API router entirely — see app/main.py role gate).
  #
  # Failure isolation: a workflow OOM / segfault here cannot affect
  # the mediahub gateway service. autoheal restarts unhealthy worker
  # containers; DBOS replays in-flight workflows from the durable
  # queue checkpoint on next start.
  #
  # Scaling: `docker compose up -d --scale mediahub-worker=N` runs N
  # workers, each pulls from the same PG queue with concurrency=8
  # default. Total parallelism = N × 8 minus per-agent partition
  # serialization. Watch RSS — Phase 2 (per-run subprocess) will cap
  # per-run memory; until then, sizing N depends on your transcribe /
  # analyze peak.
  mediahub-worker:
    image: crpi-eat03wohif79y6f2.cn-shanghai.personal.cr.aliyuncs.com/heygo/mediahub-backend:latest
    container_name: mediahub-app-worker
    restart: unless-stopped
    init: true   # R2: tini PID 1 for signal forwarding + zombie reaping
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "autoheal=true"   # supervised by autoheal sidecar (same as gateway)
    # No published port — worker only serves probes internally.
    expose:
      - "8080"
    volumes:
      - ${DOWNLOAD_HOST_PATH:-/volume2/sources/MediaHub.library}:/app/downloads
      - ./.env:/app/.env
      - ./config/config.yml:/app/config.yml
    environment:
      - TZ=Asia/Shanghai
      - REDIS_URL=redis://redis:6379/0
      - MEDIAHUB_ROLE=worker          # skip API router, run DBOS pool
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DOUBAO_API_KEY=${DOUBAO_API_KEY:-}
      - WHISPER_PROVIDER=${WHISPER_PROVIDER:-openai_api}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── GPU Transcode Support (when GPU transcoding lands) ──
  # The mediahub service above can be augmented with:
  #   runtime: nvidia
  #   environment:
  #     - NVIDIA_VISIBLE_DEVICES=all
  # or for Intel iGPU (QSV / VA-API):
  #   devices:
  #     - /dev/dri:/dev/dri

  # ── Process supervision sidecar ────────────────────────────────
  # willfarrell/autoheal watches docker healthcheck statuses on any
  # container labeled `autoheal=true` and SIGKILLs them when they go
  # unhealthy. Combined with `restart: unless-stopped`, that turns a
  # wedged container (process alive but /health/deep failing) into
  # an automatic restart cycle within ~30s.
  #
  # Why this matters for MediaHub:
  #   - DBOS workflows run in-process with FastAPI; an unhandled
  #     exception in a workflow thread can wedge uvicorn's event loop
  #     without crashing the process. Plain `restart: unless-stopped`
  #     never fires because the process is technically alive.
  #   - dev-backend.sh implements the same logic for dev. autoheal is
  #     the prod equivalent.
  #
  # Tuning:
  #   - AUTOHEAL_INTERVAL: how often autoheal polls (5s default)
  #   - AUTOHEAL_START_PERIOD: grace before autoheal is allowed to
  #     act on a freshly-started container (must exceed our backend's
  #     start_period of 60s — set to 90s)
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: mediahub-autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=90
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=15
      - TZ=Asia/Shanghai
    volumes:
      # The sidecar needs the docker socket to inspect + restart peers.
      # This is a privilege grant — autoheal effectively has root on
      # the docker daemon. Acceptable here because it's first-party
      # and pinned to willfarrell/autoheal (small, audited image).
      - /var/run/docker.sock:/var/run/docker.sock

  # Nginx - HLS streaming server
  nginx:
    image: nginx:alpine
    container_name: mediahub-app-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ${DOWNLOAD_HOST_PATH:-/volume2/sources/MediaHub.library}:/app/downloads:ro
      - ./nginx-hls.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - mediahub

  # MediaHub Admin Panel (ACR + Watchtower auto-update)
  mediahub-admin:
    image: crpi-eat03wohif79y6f2.cn-shanghai.personal.cr.aliyuncs.com/heygo/mediahub-admin:latest
    container_name: mediahub-admin
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "3097:8080"
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      mediahub:
        condition: service_healthy

volumes:
  redis_data:
