version: '3.8'

# MediaHub Docker Compose Configuration
# Usage: cd docker && docker-compose up -d
# Image: crpi-eat03wohif79y6f2.cn-shanghai.personal.cr.aliyuncs.com/heygo/mediahub-backend:latest

services:
  # Redis - Message queue and result storage
  redis:
    image: redis:7-alpine
    container_name: mediahub-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MediaHub Main Service (FastAPI)
  mediahub:
    image: crpi-eat03wohif79y6f2.cn-shanghai.personal.cr.aliyuncs.com/heygo/mediahub-backend:latest
    container_name: mediahub
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ${DOWNLOAD_HOST_PATH:-/volume2/sources/MediaHub.library}:/app/downloads
      - ./.env:/app/.env
      - ./config/config.yml:/app/config.yml
    environment:
      - TZ=Asia/Shanghai
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DOUBAO_API_KEY=${DOUBAO_API_KEY:-}
      - WHISPER_PROVIDER=${WHISPER_PROVIDER:-openai_api}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Celery Worker - Task executor (downloads, parsing, transcription, analysis)
  celery-worker:
    image: crpi-eat03wohif79y6f2.cn-shanghai.personal.cr.aliyuncs.com/heygo/mediahub-backend:latest
    container_name: mediahub-celery-worker
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    command: uv run celery -A app.celery_app worker -l info -c 4 -Q downloads,parsing,transcription,analysis,scheduled,celery
    volumes:
      - ${DOWNLOAD_HOST_PATH:-/volume2/sources/MediaHub.library}:/app/downloads
      - ./.env:/app/.env
      - ./config/config.yml:/app/config.yml
    environment:
      - TZ=Asia/Shanghai
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DOUBAO_API_KEY=${DOUBAO_API_KEY:-}
      - WHISPER_PROVIDER=${WHISPER_PROVIDER:-openai_api}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "uv run celery -A app.celery_app inspect ping --timeout 10 2>/dev/null | grep -q OK"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s
    # ── GPU Transcode Support (uncomment as needed) ──
    # NVIDIA GPU:
    #   runtime: nvidia
    #   environment:
    #     - NVIDIA_VISIBLE_DEVICES=all
    # Intel iGPU (QSV / VA-API):
    #   devices:
    #     - /dev/dri:/dev/dri

  # Celery Beat - Scheduled task scheduler
  celery-beat:
    image: crpi-eat03wohif79y6f2.cn-shanghai.personal.cr.aliyuncs.com/heygo/mediahub-backend:latest
    container_name: mediahub-celery-beat
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    command: uv run celery -A app.celery_app beat -l info
    volumes:
      - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "uv run python -c \"import redis; redis.Redis.from_url('redis://redis:6379/0').ping()\""]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  # Nginx - HLS streaming server
  nginx:
    image: nginx:alpine
    container_name: mediahub-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ${DOWNLOAD_HOST_PATH:-/volume2/sources/MediaHub.library}:/app/downloads:ro
      - ./nginx-hls.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - mediahub

  # MediaHub Admin Panel (ACR + Watchtower auto-update)
  mediahub-admin:
    image: crpi-eat03wohif79y6f2.cn-shanghai.personal.cr.aliyuncs.com/heygo/mediahub-admin:latest
    container_name: mediahub-admin
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "3097:8080"
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      mediahub:
        condition: service_healthy

volumes:
  redis_data:
