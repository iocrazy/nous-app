[project]
name = "mediahub-backend"
version = "0.7.5"
description = "MediaHub - Multi-source media analysis and download platform powered by FastAPI + Supabase"
authors = [
    {name = "heygo", email = "8512939@qq.com"}
]
license = {text = "MIT"}
# 与 .python-version / Dockerfile pin 的 python:3.13-slim 对齐。
# 曾是 ">=3.12"，而 [tool.black] target-version 已是 py313 —— 同一个文件里
# 一边按 3.13 格式化、一边声明支持 3.12。下限不是锁，正是它让 CI 拿 3.12
# 跑了很久也不报错（在生产从不使用的解释器上跑绿）。
requires-python = ">=3.13"
keywords = ["mediahub", "video", "download", "whisper", "transcription", "yt-dlp", "fastapi", "supabase"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiofiles>=24.1.0",
    "anthropic>=0.40.0",
    "aiosqlite>=0.21.0",
    "alembic>=1.16.2",
    "drissionpage>=4.1.0.18",
    "faster-whisper>=1.1.0",
    "fastapi>=0.115.12",
    "greenlet>=3.2.3",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "notion-client>=2.3.0",
    "openai>=1.0.0",
    "Pillow>=10.0.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.11.3",
    "pydantic-settings[yaml]>=2.9.1",
    "python-jose[cryptography]>=3.5.0",
    "pyjwt[crypto]>=2.8.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "redis>=6.2.0",
    "requests>=2.32.3",
    "rich>=14.0.0",
    "sqlalchemy>=2.0.41",
    "supabase>=2.18.1",
    # Issue #199 follow-up: Bug C migration to asyncpg + Supavisor.
    # Direct PG protocol (no HTTP) eliminates the supabase-py httpx
    # stale-pool failures. Coexists with supabase-py for the time
    # being; supabase-py will be removed once all repositories are
    # migrated.
    "asyncpg>=0.30.0",
    "tqdm>=4.67.1",
    "uvicorn>=0.34.3",
    "yt-dlp>=2024.12.23",
    "bleach>=6.3.0",
    "pypdf>=6.9.2",
    "python-docx>=1.2.0",
    "slowapi>=0.1.9",
    "gmssl>=3.2.2",
    "python-frontmatter>=1.1.0",
    "dbos>=2.19.0",  # PoC #1-12 validated on 2.19.0; pin major version
    "pypdfium2>=5.7.1",
    "croniter>=6.2.2",
    "brotli>=1.2.0",
    "filetype>=1.2.0",
    "pgvector>=0.4.2",
    "graphiti-core[falkordb]>=0.29.2",
    "feedparser>=6.0.12",
    "trafilatura>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure unit tests (no DB, no network)",
    "integration: integration tests (DB or network required)",
]

[project.scripts]
mediahub = "app.main:main"

[project.urls]
Homepage = "https://github.com/iocrazy/nous-app"
Repository = "https://github.com/iocrazy/nous-app"
Issues = "https://github.com/iocrazy/nous-app/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# PEP 735 标准写法。原为 [tool.uv] dev-dependencies —— uv 已标记废弃，
# 每次 uv 命令都刷一行 deprecation 警告，且那是 uv 私有字段、别的工具读不到。
# browser/ 侧统一到同一种写法（原先用 [project.optional-dependencies]，
# 导致装 dev 依赖的命令两边不一样：一边 --dev、一边 --extra dev）。
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "autoflake>=2.3.1",
    "respx>=0.21.0",  # httpx response mocking — for safe_http boundary tests
    "pre-commit>=3.7.0",  # local hook runner; mirrors CI's lint scope
]

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

# PyPI 走国内镜像。**这是 lock 里被钉死的 URL，不是运行时可覆盖的开关** ——
# uv 在 `--frozen`（CI/Docker 的用法）下严格按 uv.lock 记录的 URL 下载，
# UV_DEFAULT_INDEX 之类的环境变量完全不生效（实测 173 次请求全打
# files.pythonhosted.org）。所以想换源只能改这里再重新 `uv lock`。
#
# 2026-08-07 实测（gpupc 直连，同一个 wheel）：
#   files.pythonhosted.org  38～165 KB/s，波动剧烈
#   mirrors.aliyun.com      10.7 MB/s
# 差两个数量级。当天 CI 与部署各挂一次，重跑三轮分别卡在 virtualenv /
# dbos / posthog —— 每次卡在不同的包，因为成功的进了缓存、失败的没有。
# 走 mihomo 代理更慢（60s 无响应），runner 环境本就没有代理变量。
#
# 代价：`schema-drift.yml` 跑在 ubuntu-latest（境外），它也会拉阿里云，
# 比走官方源慢。接受这个代价，因为 self-hosted 承担的是每个 PR 的 CI +
# 每次合并的部署，频率高一个量级，而 schema-drift 只在 migration 变动时跑。
# 要回官方源：删掉这一段再 `uv lock` 即可，无残留。
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
