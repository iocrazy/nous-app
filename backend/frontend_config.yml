# ===========================================
# 前端配置文件 (frontend_config.yml)
# 用于存储前端应用的配置信息
# 优先级: 此文件 > .env 环境变量
# ===========================================

# Supabase 数据库配置
# 如果为空，前端将使用 .env 中的 VITE_SUPABASE_URL 和 VITE_SUPABASE_ANON_KEY
supabase:
  url: ""
  anon_key: ""

# 注意: default_download_path 已移至 .env 的 DOWNLOAD_PATH
# API /api/v1/config 会自动返回 .env 中的值
