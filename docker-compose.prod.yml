version: '3.8'

services:
  douyin-analysis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: douyin-analysis
    ports:
      - "8088:8080"   # 生产环境：宿主机80端口映射到容器8080端口
    environment:
      - APP_NAME=抖音推送下载app
      - HOST=0.0.0.0
      - RELOAD=true
      - DATABASE_URL=sqlite+aiosqlite:///data/db.sqlite3
      - HTTP_TIMEOUT=30.0
      - DOWNLOAD_TIMEOUT=60.0

    env_file:
      - .env.prod
    volumes:
      # 🔗 数据挂载配置 - 宿主机路径:容器路径
      # 数据库文件挂载
      - /var/douyin/data:/app/data
      # 下载视频文件挂载
      - /var/douyin/videos:/app/videos
      # 应用日志挂载
      - /var/douyin/logs:/app/logs
      # 配置文件挂载（生产环境可选，推荐使用环境变量）
      - ./.env.prod:/app/.env:ro
      - ./config.yml:/app/config.yml:ro
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

networks:
  default:
    name: douyin-prod-network
