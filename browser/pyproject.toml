[project]
name = "nous-browser"
version = "0.1.0"
description = "Nous browser automation sidecar - platform session validation and DOM publishing"
# ⚠️ 刻意与 backend（>=3.13）和仓库根 .python-version 不同，这不是漂移。
# 本服务的基础镜像是 mcr.microsoft.com/playwright/python:v1.52.0-noble，
# 而 noble 自带的是 **Python 3.12.3** —— 版本由上游 playwright 镜像决定，
# 不归我们选；那个 tag 又必须跟 dependencies 里的 playwright pin 一起动。
#
# 2026-08-06 曾把这里"统一"成 >=3.13，后果：镜像里找不到 3.13，uv 转而
# 下载一个 managed python 装进 **root 的 home**，venv 的解释器指过去；而
# Dockerfile 只 `chown -R pwuser:pwuser /app`、最后 `USER pwuser` —— 非
# root 用户碰不到那个解释器，容器起不来：
#   ./entrypoint.sh: /app/.venv/bin/uvicorn:
#     /app/.venv/bin/python: bad interpreter: Permission denied
# 生产 smoke 拦下并自动回滚了。要改这一行，先确认基础镜像的 python 版本。
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.34.3",
    "pydantic>=2.11.3",
    # patchright 是 playwright 的 undetected fork，**drop-in replacement**：
    # 只改 import，API 完全一致。换它的理由是 CDP 协议层的泄露（Runtime.enable
    # 之类页面 JS 能侧信道探到的痕迹），那是 stealth.min.js 补不到的一层 ——
    # 参考项目 sau 正是 patchright + stealth 双保险，我们此前只有后者。
    #
    # ⚠️ 它自带一份**独立的 Chromium**（1208），跟基础镜像自带的（1169）不是
    # 同一个。实测：装完 patchright 后 executable_path 指向
    # /ms-playwright/chromium-1208/，而该目录在基础镜像里不存在（EXISTS=False），
    # 必须由 Dockerfile 的 `patchright install chromium` 补上。忘了那一步，
    # 构建照样通过，运行时才炸 "Executable doesn't exist"。
    #
    # playwright 仍然保留：`playwright.async_api` 的类型/异常仍被引用，且基础
    # 镜像的版本对应关系（v1.52.0-noble ↔ playwright 1.52.0）没有改变。
    "playwright==1.52.0",
    "patchright==1.58.2",
]

# ⚠️ 刻意保持 optional-dependencies，别"统一"成 [dependency-groups]。
# Dockerfile 那层是裸 `uv sync --frozen --no-install-project`，靠的正是
# optional extras **不被默认安装**这一点，让生产镜像不含 pytest/httpx
# （那份注释就写在 Dockerfile 第 37-38 行）。dependency-groups 的 dev 组
# `uv sync` 默认就装，改过去等于把测试依赖塞进生产镜像。
#
# 代价是装 dev 依赖的命令与 backend 不一致（这里 --extra dev，那边 --dev）。
# 接受这个不一致：它换来的是生产镜像干净，比命令统一重要。
[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure unit tests (no browser, no network)",
    "integration: requires a real Chromium install",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# PyPI 走国内镜像 —— 理由与代价见 backend/pyproject.toml 同处的长注释。
# 这边尤其重要：playwright 的 wheel 有 40MB 量级，2026-08-07 的部署就是
# 卡在它身上（tls handshake eof / 下载超时），而 browser 层一挂，整条
# deploy-gpu 就红，连带挡住当天所有人的部署。
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
