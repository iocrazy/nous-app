server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS resolver with 30s TTL
    # Prevents stale DNS when backend container is recreated
    resolver 127.0.0.11 valid=30s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (index-<hash>.js/css) are immutable — cache hard so
    # repeat loads are fast. A new deploy ships new hashes, so this is safe.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must NEVER be browser-cached, else a deploy's new bundle hash is
    # ignored and the admin keeps serving stale JS until a manual hard-refresh.
    # (Applies to the SPA fallback too — try_files /index.html re-enters here.)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location /api {
        # Use variable to force nginx to re-resolve DNS on each request
        set $backend "http://mediahub:8080";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA route: exact /media → index.html (admin Media page)
    location = /media {
        try_files /index.html =404;
    }

    # Media file proxy: /media/xxx → backend
    location /media/ {
        set $backend "http://mediahub:8080";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
