# WebSocket upgrade passthrough for Supabase Realtime (/sb/realtime/v1/…).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    # Any Host: the admin is reached as 127.0.0.1 on gpupc and as
    # heygo-ubuntu (Tailscale MagicDNS) from the LAN; nothing here keys on it.
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS resolver with 30s TTL
    # Prevents stale DNS when backend container is recreated
    resolver 127.0.0.11 valid=30s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (index-<hash>.js/css) are immutable — cache hard so
    # repeat loads are fast. A new deploy ships new hashes, so this is safe.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must NEVER be browser-cached, else a deploy's new bundle hash is
    # ignored and the admin keeps serving stale JS until a manual hard-refresh.
    # (Applies to the SPA fallback too — try_files /index.html re-enters here.)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Same-origin API proxy: the admin bundle is built with VITE_API_URL=""
    # so every /api call stays on this origin (no CORS, no public hop).
    location /api {
        # Use variable to force nginx to re-resolve DNS on each request
        set $backend "http://nous-backend:8080";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin Supabase proxy: the bundle is built with VITE_SUPABASE_URL=""
    # so auth / rest / realtime go to <this origin>/sb/… and land on kong over
    # the docker network. This is what lets the admin be opened from another
    # machine (http://heygo-ubuntu:8090): a baked-in http://127.0.0.1:9082
    # would point the remote browser at ITS OWN loopback.
    location /sb/ {
        set $kong "http://nous-kong:8000";
        rewrite ^/sb/(.*)$ /$1 break;
        proxy_pass $kong;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Realtime is a long-lived WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA route: exact /media → index.html (admin Media page)
    location = /media {
        try_files /index.html =404;
    }

    # Media file proxy: /media/xxx → backend
    location /media/ {
        set $backend "http://nous-backend:8080";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
